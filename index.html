<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Portfolio Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ================= THEME (Delta-inspired) ================= */
:root {
  color-scheme: light;
  --page: #f3f2f8; --surface-1: #ffffff; --surface-2: #f0eef7;
  --text-primary: #120d24; --text-secondary: #575170; --text-muted: #8d88a3;
  --border: rgba(18,13,36,0.08); --grid: #ebe8f3;
  --accent: #5b2ee6; --accent-ink: #ffffff;
  --good: #0a9d55; --bad: #e0364f; --warn-bg: #fff3d6; --warn-ink: #7a5300;
  --s1:#6a3df0; --s2:#12b06a; --s3:#e0559f; --s4:#9cb81a; --s5:#f0652f; --s6:#1aa6d6; --s7:#e0a800; --s8:#3d6ff0;
  --other: #c4c0d4; --shadow: 0 1px 2px rgba(18,13,36,.04), 0 6px 24px rgba(18,13,36,.05);
  --radius: 18px;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#0c0918; --surface-1:#161228; --surface-2:#211b38;
    --text-primary:#f5f2ff; --text-secondary:#bcb5d6; --text-muted:#8a83a6;
    --border: rgba(200,180,255,0.10); --grid:#272042;
    --accent:#3cf58c; --accent-ink:#0c0918; --good:#3ce38a; --bad:#ff5d7d; --warn-bg:#33270f; --warn-ink:#ffc94a;
    --s1:#8f6bff; --s2:#3ce38a; --s3:#ff8fc8; --s4:#d4f15a; --s5:#ff7a45; --s6:#3cc9f5; --s7:#ffc93c; --s8:#5b8cff;
    --other:#4a4363; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 30px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
    --page:#0c0918; --surface-1:#161228; --surface-2:#211b38;
    --text-primary:#f5f2ff; --text-secondary:#bcb5d6; --text-muted:#8a83a6;
    --border: rgba(200,180,255,0.10); --grid:#272042;
    --accent:#3cf58c; --accent-ink:#0c0918; --good:#3ce38a; --bad:#ff5d7d; --warn-bg:#33270f; --warn-ink:#ffc94a;
    --s1:#8f6bff; --s2:#3ce38a; --s3:#ff8fc8; --s4:#d4f15a; --s5:#ff7a45; --s6:#3cc9f5; --s7:#ffc93c; --s8:#5b8cff;
    --other:#4a4363; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 30px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--text-primary); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html, body { overflow-x:hidden; max-width:100%; }
/* Stop the page from rubber-banding past its ends (which Telegram reads as "swipe to close"). */
html, body { overscroll-behavior:none; }
.table-wrap, .thread, .modal, .dropdown, #bc-list { overscroll-behavior:contain; }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.good { color: var(--good); } .bad { color: var(--bad); }
.hidden { display:none !important; }

/* ================= LAYOUT ================= */
header.top { position: sticky; top:0; z-index:20; background:color-mix(in srgb, var(--page) 82%, transparent); backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--border); }
.top-inner { max-width:1180px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; }
.brand { font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; white-space:nowrap; }
.brand .logo { width:30px; height:30px; border-radius:10px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:12px; font-weight:800; }
nav.tabs { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs a { text-decoration:none; color:var(--text-secondary); padding:8px 14px; border-radius:999px; white-space:nowrap; font-size:14px; font-weight:500; position:relative; transition:background .15s, color .15s; }
nav.tabs a:hover { background:var(--surface-2); }
nav.tabs a.active { color:var(--accent-ink); background:var(--accent); font-weight:600; }
nav.tabs .sep { width:1px; background:var(--border); margin:6px 4px; }
.badge { display:inline-block; min-width:18px; padding:0 5px; height:18px; line-height:18px; border-radius:9px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; text-align:center; margin-left:4px; }
.user-chip { display:flex; align-items:center; gap:8px; font-size:13px; white-space:nowrap; }
main { max-width:1180px; margin:0 auto; padding:28px 20px 96px; }
.banner { background:var(--warn-bg); color:var(--warn-ink); padding:9px 16px; font-size:13px; text-align:center; }
.banner button { margin-left:8px; }

h1 { font-size:26px; font-weight:750; margin:0 0 4px; letter-spacing:-0.025em; }
h2 { font-size:16px; font-weight:650; margin:0 0 16px; letter-spacing:-0.01em; }
.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:22px; flex-wrap:wrap; }

.card { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); }
.grid { display:grid; gap:16px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:16px; margin-bottom:16px; }
.kpi .label { font-size:12px; color:var(--text-muted); font-weight:500; text-transform:uppercase; letter-spacing:0.06em; }
.kpi .value { font-size:24px; font-weight:700; margin-top:6px; letter-spacing:-0.02em; }
.kpi .sub { font-size:13px; margin-top:2px; }
.two-col { display:grid; grid-template-columns: minmax(280px, 380px) 1fr; gap:16px; align-items:start; }
.two-col > * { min-width:0; }
@media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }

/* ================= CONTROLS ================= */
.btn { white-space:nowrap; border:1px solid var(--border); background:var(--surface-2); padding:9px 16px; border-radius:999px; cursor:pointer; font-size:14px; font-weight:600; transition:filter .15s, background .15s; }
.btn:hover { filter:brightness(1.06); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.primary:hover { filter:brightness(1.08); }
.btn.small { padding:6px 12px; font-size:13px; }
.btn.danger { color:var(--bad); }
.btn:disabled { opacity:.55; cursor:default; }
.link-btn { background:none; border:none; color:var(--accent); cursor:pointer; padding:0; font-size:13px; }
label.field { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:12px; }
label.field > span, .field-div span:first-child, .field-div label span { display:block; margin-bottom:5px; }
.field-div { font-size:13px; color:var(--text-secondary); margin-bottom:12px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=datetime-local], input[type=date], input[type=search], select, textarea {
  width:100%; padding:10px 13px; border-radius:12px; border:1px solid var(--border); background:var(--surface-2); outline:none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize:vertical; min-height:70px; }
.row { display:flex; gap:10px; }
.row > * { flex:1; }
.seg { display:inline-flex; background:var(--surface-2); border-radius:999px; padding:3px; border:1px solid var(--border); }
.seg button { border:none; background:none; padding:6px 14px; border-radius:999px; cursor:pointer; font-weight:550; color:var(--text-secondary); }
.seg button.on { background:var(--surface-1); color:var(--text-primary); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.seg button.on.buy { color:var(--good); } .seg button.on.sell { color:var(--bad); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--border); background:var(--surface-1); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; color:var(--text-secondary); }
.chip.on { background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600; }
.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar input[type=search] { max-width:260px; }
.toolbar select { width:auto; }

/* ================= TABLES ================= */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; font-weight:500; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; padding:10px 12px; border-bottom:1px solid var(--grid); white-space:nowrap; }
td { padding:14px 12px; border-bottom:1px solid var(--grid); white-space:nowrap; }
tbody tr:last-child td { border-bottom:none; }
td.r, th.r { text-align:right; }
tr.click { cursor:pointer; }
tr.click:hover td { background:var(--surface-2); }
.coin { display:flex; align-items:center; gap:9px; }
.coin { gap:11px; }
.coin img, .coin .ph { width:32px; height:32px; border-radius:50%; flex:none; }
.coin .ph { background:var(--surface-2); display:grid; place-items:center; font-size:10px; font-weight:700; color:var(--text-secondary); border:1px solid var(--border); }
.coin .sym { color:var(--text-muted); font-size:12px; text-transform:uppercase; margin-top:1px; }
.swatch { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
.tag { display:inline-block; font-size:11px; font-weight:650; padding:2px 7px; border-radius:6px; background:var(--surface-2); color:var(--text-secondary); border:1px solid var(--border); text-transform:uppercase; letter-spacing:.03em; }
.tag.req { background:var(--warn-bg); color:var(--warn-ink); border-color:transparent; }
.tag.buy { color:var(--good); } .tag.sell { color:var(--bad); }
.tag.flag { color:var(--bad); }
.empty { text-align:center; padding:36px 16px; color:var(--text-secondary); }
.empty .big { font-size:17px; color:var(--text-primary); font-weight:600; margin-bottom:6px; }

/* ================= CHART ================= */
.chart-box { position:relative; height:230px; max-width:260px; margin:4px auto 0; }
.chart-center { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; text-align:center; }
.chart-center .v { font-size:22px; font-weight:750; letter-spacing:-0.02em; }
.chart-center .l { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
.legend { margin-top:20px; display:grid; grid-template-columns:1fr 1fr; gap:10px 18px; }
.legend .li { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:500; }
.legend .swatch { width:10px; height:10px; border-radius:50%; }
.legend .li .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.legend .li .p { color:var(--text-secondary); }

/* ================= THREAD ================= */
.thread { display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; padding:4px 2px; }
.msg { max-width:85%; padding:10px 13px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); white-space:pre-wrap; word-wrap:break-word; }
.msg.mine { align-self:flex-end; }
.msg.reviewer { border-left:3px solid var(--accent); }
.msg .meta { font-size:12px; color:var(--text-muted); margin-bottom:4px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.msg .meta b { color:var(--text-primary); font-weight:650; }
.composer { margin-top:12px; display:grid; gap:8px; }
.callout { background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:12px 14px; font-size:14px; margin-bottom:16px; white-space:pre-wrap; }

/* ================= MODAL / AUTH ================= */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:grid; place-items:center; padding:16px; }
.modal { background:var(--surface-1); border-radius:22px; width:100%; max-width:480px; max-height:92vh; overflow-y:auto; padding:20px; border:1px solid var(--border); }
.modal h2 { font-size:18px; display:flex; justify-content:space-between; align-items:center; }
.x { border:none; background:none; font-size:22px; cursor:pointer; color:var(--text-muted); line-height:1; }
.search-wrap { position:relative; }
.dropdown { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:5; max-height:260px; overflow-y:auto; }
.dropdown .opt { padding:9px 11px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.dropdown .opt:hover, .dropdown .opt.hl { background:var(--surface-2); }
.picked { display:flex; align-items:center; justify-content:space-between; padding:9px 11px; border:1px solid var(--accent); border-radius:9px; background:var(--surface-2); }
.showpw { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-secondary); margin:-4px 0 12px; cursor:pointer; user-select:none; }
.range { width:100%; accent-color:var(--accent); padding:0; border:none; background:none; height:24px; }
.bucket { padding:10px 0; border-bottom:1px solid var(--grid); }
.bucket:last-child { border-bottom:none; }
.bucket-head { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
.split { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); }
.split .range { flex:1; }
.section-h { font-size:16px; margin:20px 0 10px; }
.card.urgent { border-left:4px solid var(--accent); }
.card.drop { border-left:4px solid var(--bad); }
.alert-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--warn-bg); color:var(--warn-ink); border-radius:14px; padding:12px 16px; margin-bottom:18px; text-decoration:none; font-size:14px; }
details.past { padding:8px 0; border-bottom:1px solid var(--grid); }
details.past summary { cursor:pointer; }
.tpbar { position:relative; height:12px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); margin:14px 0 6px; }
.tpz { position:absolute; top:-1px; bottom:-1px; background:color-mix(in srgb, var(--good) 35%, transparent); border-radius:6px; }
.tpm { position:absolute; top:-5px; width:3px; height:20px; border-radius:2px; transform:translateX(-1px); }
.tpm.now { background:var(--text-primary); } .tpm.avg { background:var(--accent); } .tpm.min { background:var(--warn-ink); } .tpm.ext { background:var(--good); }
.tplegend { display:flex; gap:4px 12px; flex-wrap:wrap; font-size:12px; margin-top:6px; color:var(--text-secondary); }
.tplegend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
.tplegend i.now { background:var(--text-primary); } .tplegend i.avg { background:var(--accent); } .tplegend i.min { background:var(--warn-ink); } .tplegend i.ext { background:var(--good); } .tplegend i.zone { background:color-mix(in srgb, var(--good) 35%, transparent); }
.guide-list { margin:0; padding-left:18px; display:grid; gap:6px; font-size:14px; }
.pledge { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--grid); cursor:pointer; font-size:14px; }
.pledge input[type=checkbox] { width:18px; height:18px; min-width:18px; flex:0 0 18px; margin:1px 0 0; padding:0; accent-color:var(--accent); cursor:pointer; }
.pledge span { flex:1; min-width:0; }
table.exit-steps select, table.exit-steps input { padding:5px 7px; font-size:13px; }
table.exit-steps td.sell { white-space:normal; }
table.exit-steps .ex-price { display:block; width:100%; max-width:150px; margin-top:4px; }
table.exit-steps td.drag { width:28px; padding-left:2px; padding-right:2px; }
.drag-h { cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; color:var(--text-muted); font-size:18px; line-height:1; padding:8px 6px; display:inline-block; border-radius:6px; }
.drag-h:active { cursor:grabbing; background:var(--surface-2); }
tr.dragging td { background:var(--surface-2); }
tr.dragging { opacity:.9; box-shadow:0 4px 14px rgba(0,0,0,.18); }
.btn-row { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
.btn-row > .btn { flex:none; }
.add-coin { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.add-coin select { flex:1 1 160px; width:auto; min-width:0; }
.add-coin .search-wrap { flex:1 1 220px; }
.add-coin .btn { flex:none; }
@media (max-width:640px) { table.plan .coin > div > div:first-child { display:none; } table.plan .coin .sym { font-size:13px; color:var(--text-primary); font-weight:600; } table.plan th, table.plan td { padding-left:5px; padding-right:5px; } table.plan .coin img, table.plan .coin .ph { display:none; } }
.showpw input { width:16px; height:16px; margin:0; accent-color:var(--accent); cursor:pointer; }

.tc-list { display:flex; flex-direction:column; gap:10px; }
.tc { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--surface-1); }
.tc-head { display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px; background:none; border:none; cursor:pointer; text-align:left; color:inherit; font:inherit; }
.tc-head .coin { flex:1; min-width:0; }
.tc-stats { text-align:right; font-size:13px; }
.tc-chev { color:var(--text-muted); transition:transform .15s; flex:none; }
.tc.open .tc-chev { transform:rotate(90deg); }
.tc-sum { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:0 14px 12px; font-size:12px; }
.tc-sum b { display:block; font-size:13px; font-weight:600; color:var(--text-primary); }
.tc-sum span { color:var(--text-muted); }
.tc-tx { border-top:1px solid var(--grid); }
.tc-row { display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--grid); font-size:13px; }
.tc-row:first-child { border-top:none; }
.tc-tap { width:100%; background:none; border-left:none; border-right:none; border-bottom:none; color:inherit; font:inherit; text-align:left; cursor:pointer; padding:12px 14px; }
.tc-tap .r { text-align:right; } .tc-tap:active { background:var(--surface-2); }
.tc-row .main { flex:1; min-width:0; }
.tc-row .meta { color:var(--text-muted); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tc-row .acts { display:flex; gap:10px; flex:none; }
.tr-tools { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.tr-tools select { width:auto; }
@media (max-width:640px) { .tc-sum { grid-template-columns:repeat(2,1fr); } }
#pj-table tr.pj-total td { border-top:2px solid var(--grid); }
.hint { font-size:12px; color:var(--text-muted); margin-top:4px; }
.err { color:var(--bad); font-size:13px; margin:8px 0; min-height:1em; }
.auth-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
.auth { width:100%; max-width:400px; }
.auth .brand { justify-content:center; font-size:20px; margin-bottom:6px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--text-primary); color:var(--surface-1); padding:11px 18px; border-radius:999px; font-size:14px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.25); }
.spinner { width:22px; height:22px; border:3px solid var(--grid); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:40px auto; }
@keyframes spin { to { transform:rotate(360deg); } }


/* ================= DELTA-STYLE COMPONENTS ================= */
.pill { display:inline-flex; align-items:center; gap:3px; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:600; background:var(--surface-2); color:var(--text-secondary); white-space:nowrap; }
.pill.good { color:var(--good); background:color-mix(in srgb, var(--good) 14%, transparent); }
.pill.bad { color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent); }
.pill.sm { font-size:12px; padding:2px 8px; }
.hero { padding:24px 24px 18px; margin-bottom:16px; }
.hero-head { display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; }
.hero .label { font-size:13px; color:var(--text-muted); font-weight:500; }
.hero .big { font-size:40px; font-weight:800; letter-spacing:-0.035em; line-height:1.1; margin:6px 0 10px; }
.hero .chg { display:flex; gap:8px; flex-wrap:wrap; align-items:center; font-size:13px; color:var(--text-muted); }
.periods { display:inline-flex; gap:2px; background:var(--surface-2); border-radius:999px; padding:3px; }
.periods button { border:none; background:none; color:var(--text-muted); font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; cursor:pointer; }
.periods button.on { background:var(--surface-1); color:var(--text-primary); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.hero-chart { position:relative; height:210px; margin:16px -6px 4px; }

<script>
/* =====================================================================
   CONFIG: fill these in after creating your Supabase project.
   Leave SUPABASE_URL empty to run in DEMO mode (sample data, no logins).

const CONFIG = {

  SUPABASE_ANON_KEY: "sb_publishable_RK-nD_oFF3KHWQM2leIsrw_OW2kASrj",   // publishable key (safe in browser; RLS protects data)
  COINGECKO_DEMO_KEY: "",    // optional free key from coingecko.com/en/api (raises rate limits)

const DEMO = !CONFIG.SUPABASE_URL;

/* ===================== UTILITIES ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const LOCALE_DOT = (() => { try { return new Intl.NumberFormat().formatToParts(1.5).find(p => p.type === "decimal")?.value !== ","; } catch (e) { return true; } })();
/** Parse a typed amount: accepts "0,67", "1 200.5", "$4,326.87". */
function dec(v) {
  let s = String(v ?? "").trim().replace(/[\s$]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, "");          // 1,234.56
  else if (/^[1-9]\d{0,2}(,\d{3})+$/.test(s) && LOCALE_DOT) s = s.replace(/,/g, ""); // 1,234 (dot-decimal locales)
  else s = s.replace(",", ".");                                              // 0,67
  const n = Number(s); return Number.isFinite(n) ? n : NaN;
}
const decOr0 = (v) => { const n = dec(v); return Number.isNaN(n) ? 0 : n; };
function fmtUsd(v, opts = {}) {
  const n = num(v), a = Math.abs(n);
  if (opts.compact && a >= 100000) return (n < 0 ? "-" : "") + "$" + new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 }).format(a);
  return (n < 0 ? "-" : "") + "$" + a.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPrice(v) {
  const n = num(v);
  if (n === 0) return "$0";
  if (n >= 1) return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (n >= 0.01) return "$" + n.toFixed(4);
  return "$" + n.toPrecision(4);
}
function fmtQty(v) {
  const n = num(v);
  if (n >= 1000) return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  if (n >= 1) return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
  return n.toLocaleString("en-US", { maximumSignificantDigits: 6 });
}
function fmtPct(v, sign = true) { const n = num(v); return (sign && n > 0 ? "+" : "") + n.toFixed(2) + "%"; }
function signCls(v) { return num(v) > 0 ? "good" : num(v) < 0 ? "bad" : ""; }
function fmtDate(d, withTime = true) {
  if (!d) return "—";
  const dt = new Date(d);
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) + (withTime ? " · " + dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "");
}
function fmtJoined(d) { if (!d) return ""; const t = new Date(d + "T12:00:00"); if (isNaN(t)) return ""; const m = Math.floor((Date.now() - t) / (30.44 * 86400000)); return t.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + (m >= 1 ? ` (${m >= 12 ? Math.floor(m / 12) + "y " + (m % 12 ? (m % 12) + "mo" : "") : m + "mo"} in CC)`.replace(" )", ")") : ""); }
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function ago(d) {
  if (!d) return "never";
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return fmtDate(d, false);
}
function toLocalInput(d) { const dt = new Date(d); const p = (n) => String(n).padStart(2, "0"); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(dt.getHours())}:${p(dt.getMinutes())}`; }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function memberName(p) { return p?.display_name || (p?.telegram_handle ? "@" + p.telegram_handle.replace(/^@/, "") : "Member"); }
function handleLink(h) { if (!h) return ""; const clean = esc(h.replace(/^@/, "")); return `<a href="https://t.me/${clean}" target="_blank" rel="noopener">@${clean}</a>`; }
function coinLink(id) { return `https://www.coingecko.com/en/coins/${encodeURIComponent(id)}`; }
function coinIcon(c) {
  const ab = esc((c.symbol || "?").slice(0, 3).toUpperCase());
  return c.image ? `<img src="${esc(c.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${ab}'}))">` : `<span class="ph">${ab}</span>`;
}
/** Coins are shown by ticker (TET, ACN, PAAL…). showName adds the full name underneath, only where it helps tell coins apart (search results). */
function coinCell(c, showName = false) {
  const img = c.image ? `<img src="${esc(c.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${esc((c.symbol||'?').slice(0,3).toUpperCase())}'}))">` : `<span class="ph">${esc((c.symbol || "?").slice(0, 3).toUpperCase())}</span>`;
  const sym = String(c.symbol || "").toUpperCase(), name = c.name || c.coin_id || "";
  const main = sym || name, sub = showName && sym && name && name.toUpperCase() !== sym ? name : "";
  return `<div class="coin">${img}<div><div style="font-weight:600">${esc(main)}</div>${sub ? `<div class="sym" style="text-transform:none">${esc(sub)}</div>` : ""}</div></div>`;
}

/** "Tectum (TET)", but just "PAAL AI" / "Velo" when the name already says the ticker. */
/** Ticker only: "TET", "PAAL". Falls back to the name when there's no ticker; "Tectum (TET)" → "TET". */
function nameSym(name, sym) {
  sym = String(sym || "").trim().toUpperCase(); if (sym) return sym;
  name = String(name || "").trim(); const m = name.match(/\(([^)]+)\)\s*$/); return m ? m[1].toUpperCase() : name;
}
function coinLabel(id) { return symOf(id); }

/** CoinGecko renamed some coin ids (ACN after the AITECH migration, OTK). Saved trades, plans and settings may
 *  still use the old ids, so everything read from the database is translated to the current ones. */
const COIN_ID_RENAMES = { "solidus-ai-tech": "solidus-aitech", "octokn": "octo-gaming" };
function canonIds(data) {
  if (data == null || typeof data !== "object") return typeof data === "string" && COIN_ID_RENAMES[data] ? COIN_ID_RENAMES[data] : data;
  let j = JSON.stringify(data), changed = false;
  for (const [o, n] of Object.entries(COIN_ID_RENAMES)) if (j.includes('"' + o + '"')) { j = j.split('"' + o + '"').join('"' + n + '"'); changed = true; }
  return changed ? JSON.parse(j) : data;
}

/* ===================== COINGECKO ===================== */
const CG = {
  base: "https://api.coingecko.com/api/v3",
  cache: {},          // id -> { price, change24, mcap, image, symbol, name, at }
  offline: false,
  headers() { return CONFIG.COINGECKO_DEMO_KEY ? { "x-cg-demo-api-key": CONFIG.COINGECKO_DEMO_KEY } : {}; },
  async get(path, retry = 1) {
    const r = await fetch(this.base + path, { headers: this.headers() });
    if (r.status === 429 && retry > 0) { await new Promise(res => setTimeout(res, 2500)); return this.get(path, retry - 1); }   // free plan rate limit: wait and try once more
    if (!r.ok) throw new Error("CoinGecko " + r.status);
    return r.json();
  },
  /** Fresh spot price for one coin (cheap endpoint), used by the live price charts. */
  async live(id) {
    const d = await this.get(`/simple/price?ids=${encodeURIComponent(id)}&vs_currencies=usd&include_24hr_change=true`);
    const r = d && d[id]; if (!r || !Number.isFinite(r.usd)) throw new Error("no price");
    const c = this.cache[id] || {};
    this.cache[id] = { ...c, price: r.usd, change24: r.usd_24h_change ?? c.change24, at: Date.now(), sample: false, liveAt: Date.now(), src: "CoinGecko", cgPrice: r.usd };
    this.offline = false;
    return this.cache[id];
  },
  /** Make sure we have fresh market data for these coin ids (batched). */
  async ensure(ids, maxAgeMs = 60000) {
    const now = Date.now();
    const need = [...new Set(ids)].filter(id => id && (!this.cache[id] || now - this.cache[id].at > maxAgeMs));
    for (let i = 0; i < need.length; i += 200) {
      const batch = need.slice(i, i + 200);
      try {
        const rows = await this.get(`/coins/markets?vs_currency=usd&ids=${encodeURIComponent(batch.join(","))}&per_page=250&price_change_percentage=24h,7d`);
        for (const r of rows) {
          const prev = this.cache[r.id], fresh = prev && prev.liveAt && now - prev.liveAt < 60000;   // keep a live exchange price over CoinGecko's slower one
          this.cache[r.id] = { price: r.current_price, change24: r.price_change_percentage_24h, change7: r.price_change_percentage_7d_in_currency ?? null, mcap: r.market_cap, image: r.image, symbol: r.symbol, name: r.name, at: now, cgPrice: r.current_price,
            ...(fresh ? { price: prev.price, change24: prev.change24 ?? r.price_change_percentage_24h, liveAt: prev.liveAt, src: prev.src } : {}) };
        }
        this.offline = false;
      } catch (e) {
        this.offline = true;
        const ps = document.getElementById("price-src"); if (ps) ps.textContent = " and sample prices (CoinGecko unreachable here)";
        for (const id of batch) if (SAMPLE_PRICES[id] && !this.cache[id]) this.cache[id] = { ...SAMPLE_PRICES[id], at: now, sample: true };
      }
    }
  },
  async search(q) {
    try {
      const d = await this.get(`/search?query=${encodeURIComponent(q)}`);
      this.offline = false;
      return (d.coins || []).slice(0, 12).map(c => ({ id: c.id, name: c.name, symbol: c.symbol, image: c.thumb, rank: c.market_cap_rank }));
    } catch (e) {
      this.offline = true;
      const ql = q.toLowerCase();
      return Object.entries(SAMPLE_PRICES).filter(([id, c]) => id.includes(ql) || c.name.toLowerCase().includes(ql) || c.symbol.includes(ql))
        .map(([id, c]) => ({ id, name: c.name, symbol: c.symbol, rank: c.rank }));
    }
  },
  /** Daily price (00:00 UTC) on a given date. */
  async historical(id, date) {
    const d = new Date(date);
    if (Date.now() - d.getTime() < 24 * 3600 * 1000) { await this.ensure([id], 0); return this.cache[id]?.price ?? null; }
    const p = (n) => String(n).padStart(2, "0");
    const res = await this.get(`/coins/${encodeURIComponent(id)}/history?date=${p(d.getUTCDate())}-${p(d.getUTCMonth()+1)}-${d.getUTCFullYear()}&localization=false`);
    return res?.market_data?.current_price?.usd ?? null;
  },
  info(id) { return this.cache[id]; },
};
// Used only if CoinGecko can't be reached (demo / offline). Illustrative, not live.
const SAMPLE_PRICES = {
  "bitcoin":         { name: "Bitcoin", symbol: "btc", price: 95000, change24: 1.2, rank: 1 },
  "ethereum":        { name: "Ethereum", symbol: "eth", price: 3200, change24: -0.8, rank: 2 },
  "solana":          { name: "Solana", symbol: "sol", price: 180, change24: 2.4, rank: 5 },
  "paal-ai":         { name: "PAAL AI", symbol: "paal", price: 0.08, change24: -3.1, rank: 700 },
  "velo":            { name: "Velo", symbol: "velo", price: 0.012, change24: 4.6, rank: 600 },
  "octo-gaming":          { name: "Octo Gaming", symbol: "otk", price: 0.004, change24: -1.9, rank: 1500 },
  "tectum":          { name: "Tectum", symbol: "tet", price: 1.2, change24: -17.5, change7: -21.0, rank: 1800 },
  "solidus-aitech": { name: "AITECH Cloud Network", symbol: "acn", price: 0.03, change24: 6.2, change7: 11.4, rank: 650 },
  "tether":          { name: "Tether", symbol: "usdt", price: 1, change24: 0, change7: 0, rank: 3 },
  "usd-coin":        { name: "USDC", symbol: "usdc", price: 1, change24: 0, change7: 0, rank: 7 },
};

/* ===================== PORTFOLIO MATH (average cost) ===================== */
function computePortfolio(txs) {
  const byCoin = {};
  const sorted = [...txs].sort((a, b) => new Date(a.executed_at) - new Date(b.executed_at));
  let realizedTotal = 0;
  for (const t of sorted) {
    const h = byCoin[t.coin_id] ||= { coin_id: t.coin_id, symbol: t.symbol, name: t.name, qty: 0, cost: 0, realized: 0, firstBuy: null, lastTx: null, lastPrice: 0, trades: 0 };
    const q = num(t.quantity), p = num(t.price_usd), fee = num(t.fee_usd);
    h.trades++; h.lastTx = t.executed_at; h.lastPrice = p;
    if (t.symbol) h.symbol = t.symbol; if (t.name) h.name = t.name;
    if (t.side === "buy") {
      h.qty += q; h.cost += q * p + fee;
      if (!h.firstBuy) h.firstBuy = t.executed_at;
    } else {
      const sellQ = Math.min(q, h.qty);
      const avg = h.qty > 0 ? h.cost / h.qty : 0;
      const r = sellQ * p - fee - sellQ * avg;
      h.realized += r; realizedTotal += r;
      h.cost -= sellQ * avg; h.qty -= sellQ;
      if (h.qty < 1e-12) { h.qty = 0; h.cost = 0; }
    }
  }
  let value = 0, cost = 0, chg = 0, estimated = false;
  const holdings = [];
  for (const h of Object.values(byCoin)) {
    if (h.qty <= 0) continue;
    const info = CG.info(h.coin_id);
    const price = info?.price ?? h.lastPrice;
    if (!info) estimated = true;
    const v = h.qty * price;
    const c24 = info?.change24 ?? 0;
    holdings.push({ ...h, image: info?.image, price, value: v, avg: h.cost / h.qty, pnl: v - h.cost, pnlPct: h.cost > 0 ? (v - h.cost) / h.cost * 100 : 0, change24: c24, priceEstimated: !info });
    value += v; cost += h.cost; chg += v - v / (1 + c24 / 100);
  }
  holdings.sort((a, b) => b.value - a.value);
  for (const h of holdings) h.alloc = value > 0 ? h.value / value * 100 : 0;
  return { holdings, totals: { value, cost, pnl: value - cost, pnlPct: cost > 0 ? (value - cost) / cost * 100 : 0, realized: realizedTotal, change24Usd: chg, change24Pct: value - chg > 0 ? chg / (value - chg) * 100 : 0 }, estimated, coinIds: Object.keys(byCoin) };
}

/* ===================== DATA LAYER ===================== */
let sb = null;
const api = DEMO ? makeDemoApi() : makeSupabaseApi();

function makeSupabaseApi() {
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return canonIds(data); };
  async function fetchAll(build) {
    const size = 1000; let from = 0, out = [];
    for (;;) { const data = ok(await build().range(from, from + size - 1)); out = out.concat(data); if (data.length < size) break; from += size; }
    return out;
  }
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session; },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, meta) { const d = ok(await sb.auth.signUp({ email, password, options: { data: meta } })); return !!d.session; },
    async resetPassword(email) { ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })); },
    async updatePassword(pw) { ok(await sb.auth.updateUser({ password: pw })); },
    async signOut() { await sb.auth.signOut(); },
    async me() { const s = await this.session(); return ok(await sb.from("profiles").select("*").eq("id", s.user.id).single()); },
    async email() { const s = await this.session(); return s?.user?.email; },
    async transactions(userId) { return fetchAll(() => sb.from("transactions").select("*").eq("user_id", userId).order("executed_at")); },
    async addTx(tx) { return ok(await sb.from("transactions").insert(tx).select().single()); },

const HIST_PERIODS = [[7, "7D"], [30, "1M"], [90, "3M"], [365, "1Y"]];
CG.hist = {};
CG.chart = async function (id, days) {
  const k = id + ":" + days, c = this.hist[k];

};
function rgba(hex, a) {
  const h = String(hex).trim().replace("#", "");
  if (h.length !== 6) return hex;
  return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`;
}
const signed = (v) => (num(v) > 0 ? "+" : "") + fmtUsd(v);
const arrow = (v) => num(v) > 0 ? "▲" : num(v) < 0 ? "▼" : "";
/** Portfolio value and money invested over the last `days`, from trades + CoinGecko price history. */
async function portfolioHistory(txs, days) {
  const sorted = [...txs].sort((a, b) => new Date(a.executed_at) - new Date(b.executed_at));
  if (!sorted.length) return null;
  const now = Date.now();
  const from = Math.max(now - days * 864e5, new Date(sorted[0].executed_at).getTime());
  const cur = computePortfolio(txs);
  const val = (id) => cur.holdings.find(h => h.coin_id === id)?.value || 0;
  const ids = [...new Set(sorted.map(t => t.coin_id))].sort((a, b) => val(b) - val(a)).slice(0, 12);
  const series = {}; let ok = 0;
  for (const id of ids) { try { series[id] = await CG.chart(id, days); if (series[id].length) ok++; } catch (e) {} }
  if (!ok) return null;
  const priceAt = (id, t, fallback) => {
    const s = series[id];
    if (!s || !s.length) return CG.info(id)?.price ?? fallback;
    let lo = 0, hi = s.length - 1;
    if (t <= s[0][0]) return s[0][1];
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (s[m][0] <= t) lo = m; else hi = m - 1; }
    return s[lo][1];
  };
  const N = 90, pos = {}, pts = []; let j = 0;
  for (let i = 0; i < N; i++) {
    const t = from + (now - from) * i / (N - 1);
    while (j < sorted.length && new Date(sorted[j].executed_at).getTime() <= t) {
      const x = sorted[j++], h = pos[x.coin_id] ||= { qty: 0, cost: 0, last: 0 };
      const q = num(x.quantity), pr = num(x.price_usd), fee = num(x.fee_usd); h.last = pr;
      if (x.side === "buy") { h.qty += q; h.cost += q * pr + fee; }
      else { const sq = Math.min(q, h.qty), avg = h.qty > 0 ? h.cost / h.qty : 0; h.cost -= sq * avg; h.qty -= sq; if (h.qty < 1e-12) { h.qty = 0; h.cost = 0; } }
    }
    let value = 0, invested = 0;
    for (const [id, h] of Object.entries(pos)) { if (h.qty <= 0) continue; value += h.qty * priceAt(id, t, h.last); invested += h.cost; }
    pts.push({ t, value, invested });
  }
  return pts;
}

async function paintHero(txs, chartId = "hero") {
  const box = document.getElementById(chartId + "-chart"); if (!box) return;
  const days = S.histDays || 30, tok = (S.heroTok = (S.heroTok || 0) + 1);
  document.querySelectorAll(`[data-hero="${chartId}"] button`).forEach(b => b.onclick = () => {
    S.histDays = +b.dataset.d;
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
    paintHero(txs, chartId);
  });
  if (!S.charts[chartId]) box.innerHTML = `<div class="note">Loading chart…</div>`;
  const pts = await portfolioHistory(txs, days).catch(() => null);
  if (pts && pts.length) { const live = computePortfolio(txs).totals.value; if (live > 0) pts[pts.length - 1] = { ...pts[pts.length - 1], t: Date.now(), value: live }; }   // end on the live value shown above
  if (tok !== S.heroTok || !document.body.contains(box)) return;
  if (S.charts[chartId]) { S.charts[chartId].destroy(); delete S.charts[chartId]; }
  const per = document.getElementById(chartId + "-period");
  if (!pts || pts.length < 2) { box.innerHTML = `<div class="note">${CG.offline ? "The chart needs live CoinGecko prices. Try again in a minute." : "Not enough price history yet."}</div>`; if (per) per.textContent = ""; return; }
  box.innerHTML = `<canvas id="${chartId}-cv" role="img" aria-label="Portfolio value over time"></canvas>`;
  const a = pts[0], z = pts[pts.length - 1];
  const gain = (z.value - z.invested) - (a.value - a.invested);

/* ---------- LIVE PRICES: Coinbase (BTC, ETH) + MEXC via Supabase (alts), CoinGecko as fallback ---------- */
const LIVE = {
  CB: { "BTC-USD": "bitcoin", "ETH-USD": "ethereum" },
  ws: null, wsRetry: 0, altTimer: null, altOff: 0, listeners: new Set(),
  /** Store a live price, skipping it if it disagrees wildly with CoinGecko (a different token with the same ticker). */
  set(id, price, change24, src) {
    if (!Number.isFinite(price) || price <= 0) return;
    const c = CG.cache[id] || {};
    if (src === "MEXC" && (!c.cgPrice || Math.abs(price / c.cgPrice - 1) > 0.3)) return;   // need CoinGecko's price to check it's the same token
    CG.cache[id] = { ...c, price, change24: change24 ?? c.change24, at: Date.now(), liveAt: Date.now(), sample: false, src };
    CG.offline = false;
    this.listeners.forEach(fn => { try { fn(id); } catch (e) {} });
  },
  start() { this.startCoinbase(); this.startAlts(); },
  stop() { try { this.ws && this.ws.close(); } catch (e) {} this.ws = null; clearInterval(this.altTimer); this.altTimer = null; },
  startCoinbase() {
    if (this.ws && this.ws.readyState < 2) return;
    try {
      const ws = new WebSocket("wss://ws-feed.exchange.coinbase.com"); this.ws = ws;
      ws.onopen = () => { this.wsRetry = 0; ws.send(JSON.stringify({ type: "subscribe", product_ids: Object.keys(this.CB), channels: ["ticker"] })); };
      ws.onmessage = (e) => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; }
        if (m.type !== "ticker" || !this.CB[m.product_id]) return;
        const p = +m.price, open = +m.open_24h;
        this.set(this.CB[m.product_id], p, open > 0 ? (p - open) / open * 100 : null, "Coinbase");
      };
      ws.onclose = () => { if (this.ws === ws) this.ws = null; if (!document.hidden && S.me) setTimeout(() => this.startCoinbase(), Math.min(30000, 2000 * 2 ** this.wsRetry++)); };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    } catch (e) {}
  },
  altIds() {
    const ids = new Set([...modelCoinIds(), ...(S.txs || []).map(t => t.coin_id)]);
    Object.values(this.CB).forEach(id => ids.delete(id)); STABLE_IDS.forEach(id => ids.delete(id));
    return [...ids].filter(Boolean);
  },
  async pollAlts() {
    if (api.demo || !sb || document.hidden || Date.now() < this.altOff) return;
    const ids = this.altIds(); if (!ids.length) return;
    const bySym = {}; ids.forEach(id => { const sy = symOf(id); if (sy && sy.length <= 12) (bySym[sy] ||= []).push(id); });
    try {
      const { data, error } = await sb.functions.invoke("prices", { body: { symbols: Object.keys(bySym) } });
      if (error || !data || !data.prices) throw error || new Error("no data");
      for (const [sy, t] of Object.entries(data.prices)) (bySym[sy] || []).forEach(id => this.set(id, t.price, t.change24, "MEXC"));
    } catch (e) { this.altOff = Date.now() + 5 * 60000; }   // function not deployed / MEXC down: CoinGecko only, try again in 5 min
  },

    const { ctx, chartArea: ca } = chart, text = o.text(chart.data.datasets[0].data[meta.data.length - 1]);

const TRADE_SORTS = { value: "Value", trades: "Most trades", name: "Name A–Z", recent: "Last trade", pnl: "P&L" };
function tradesByCoin() {
  const pf = computePortfolio(S.txs), groups = new Map();
  for (const t of S.txs) { if (!groups.has(t.coin_id)) groups.set(t.coin_id, []); groups.get(t.coin_id).push(t); }
  const list = [...groups.entries()].map(([id, txs]) => {
    txs.sort((a, b) => new Date(b.executed_at) - new Date(a.executed_at));
    const h = pf.holdings.find(x => x.coin_id === id), t0 = txs[0], info = CG.info(id);
    const bought = txs.filter(t => t.side === "buy").reduce((a, t) => a + num(t.quantity) * num(t.price_usd), 0);
    return { id, txs, h, symbol: t0.symbol, name: t0.name, image: info?.image, last: new Date(t0.executed_at), value: h?.value || 0, pnl: h?.pnl ?? null, pnlPct: h?.pnlPct, bought };
  });
  const k = S.tradeSort || "value";
  const cmp = { value: (a, b) => b.value - a.value, trades: (a, b) => b.txs.length - a.txs.length, name: (a, b) => String(a.name).localeCompare(b.name), recent: (a, b) => b.last - a.last, pnl: (a, b) => (b.pnl ?? -1e18) - (a.pnl ?? -1e18) }[k];
  return list.sort(cmp);
}

function exportCsv() {

  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));

/* ---------- Trade modal ---------- */
function openTradeModal(existing, presetCoinId) {
  const t = existing ? { ...existing } : { side: "buy", executed_at: new Date().toISOString(), fee_usd: 0 };
  const src = existing || (presetCoinId && S.txs.find(x => x.coin_id === presetCoinId));
  let coin = src ? { id: src.coin_id, name: src.name, symbol: src.symbol, image: CG.info(src.coin_id)?.image } : null;
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <h2>${existing ? "Edit trade" : "Add trade"} <button class="x" aria-label="Close">×</button></h2>
    <div style="margin-bottom:16px"><div class="seg" id="side"><button data-s="buy" class="buy">Buy</button><button data-s="sell" class="sell">Sell</button></div></div>
    <div class="field-div"><span>Coin</span><div id="coin-slot"></div></div>
    <div class="row">
      <label class="field"><span>Quantity</span><input type="text" enterkeyhint="done" inputmode="decimal" autocomplete="off" id="qty" value="${existing ? esc(+Number(existing.quantity).toPrecision(12)) : ""}" placeholder="0.00"></label>
      <label class="field"><span>Price per coin</span><input type="text" enterkeyhint="done" inputmode="decimal" autocomplete="off" id="price" value="${existing ? esc(+Number(existing.price_usd).toPrecision(6)) : ""}" placeholder="$0.00"></label>
    </div>
    <div class="row">
      <label class="field"><span>Total</span><input type="text" enterkeyhint="done" inputmode="decimal" autocomplete="off" id="total" placeholder="$0.00"></label>
      <label class="field"><span>Fee</span><input type="text" enterkeyhint="done" inputmode="decimal" autocomplete="off" id="fee" value="${num(t.fee_usd) ? esc(t.fee_usd) : ""}" placeholder="$0.00"></label>
    </div>
    <label class="field"><span>Date</span><input type="datetime-local" id="when" value="${toLocalInput(t.executed_at)}"></label>
    <label class="field"><span>Notes</span><textarea id="note" maxlength="500" placeholder="Optional">${esc(t.note || "")}</textarea></label>
    <div class="err" id="trade-err"></div>
    <div class="row" style="justify-content:space-between;align-items:center">${existing ? `<button class="link-btn" id="del-trade" type="button" style="color:var(--bad)">Delete</button>` : "<span></span>"}
      <div class="row" style="flex:none;gap:8px"><button class="btn" id="cancel" style="flex:none">Cancel</button><button class="btn primary" id="save" style="flex:none">${existing ? "Save" : "Add trade"}</button></div></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector(".x").onclick = close; $("#cancel", ov).onclick = close;
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  let side = t.side;
  const paintSide = () => ov.querySelectorAll("#side button").forEach(b => b.classList.toggle("on", b.dataset.s === side));
  ov.querySelectorAll("#side button").forEach(b => b.onclick = () => { side = b.dataset.s; paintSide(); });
  paintSide();
  const qty = $("#qty", ov), price = $("#price", ov), total = $("#total", ov);
  let priceTouched = !!existing, lastMoney = "price";   // which of price/total the user typed last
  const syncTotal = () => { const q = decOr0(qty.value), p = decOr0(price.value); if (q && p) total.value = +(q * p).toFixed(2); };
  const syncPrice = () => { const q = decOr0(qty.value), tt = decOr0(total.value); if (q && tt) price.value = +(tt / q).toPrecision(8); };
  qty.oninput = () => { lastMoney === "total" ? syncPrice() : syncTotal(); };
  price.oninput = () => { priceTouched = true; lastMoney = "price"; syncTotal(); };
  total.oninput = () => { priceTouched = true; lastMoney = "total"; syncPrice(); };
  syncTotal();

  const slot = $("#coin-slot", ov);
  function paintCoin() {
    if (coin) {
      slot.innerHTML = `<div class="picked">${coinCell({ ...coin, coin_id: coin.id })}<button class="link-btn" type="button" id="change-coin">Change</button></div>`;
      $("#change-coin", ov).onclick = () => { coin = null; paintCoin(); };
      if (!existing && !price.value) prefillCurrent();
      return;
    }
    slot.innerHTML = `<div class="search-wrap"><input type="search" enterkeyhint="done" id="coin-q" placeholder="Type a name, ticker, or paste a CoinGecko link" autocomplete="off"><div class="dropdown hidden" id="coin-dd"></div></div>`;
    const q = $("#coin-q", ov), dd = $("#coin-dd", ov);
    q.focus();
    const run = debounce(async () => {
      let s = q.value.trim();
      const m = s.match(/coingecko\.com\/(?:[a-z]{2}\/)?coins\/([a-z0-9-]+)/i);
      if (m) s = m[1];
      if (s.length < 2) { dd.classList.add("hidden"); return; }
      dd.classList.remove("hidden"); dd.innerHTML = `<div class="opt muted">Searching…</div>`;
      const res = await CG.search(s);
      if (!res.length) { dd.innerHTML = `<div class="opt muted">No coins found. Try the ticker or paste the CoinGecko page link.</div>`; return; }
      dd.innerHTML = res.map((c, i) => `<div class="opt" data-i="${i}">${coinCell({ ...c, coin_id: c.id }, true)}<span class="muted" style="font-size:12px">${c.rank ? "#" + c.rank : ""}</span></div>`).join("");
      dd.querySelectorAll(".opt[data-i]").forEach(o => o.onclick = () => { coin = res[+o.dataset.i]; paintCoin(); });
    }, 350);
    q.oninput = run;
  }
  async function prefillCurrent() {
    await CG.ensure([coin.id]);
    const p = CG.info(coin.id)?.price;
    if (p && !price.value && !priceTouched) { price.value = +p.toPrecision(6); syncTotal(); }
  }
  paintCoin();

  $("#del-trade", ov) && ($("#del-trade", ov).onclick = () => { close(); confirmModal("Delete this trade?", "This can't be undone.", async () => {
    await api.deleteTx(existing.id); S.txs = S.txs.filter(x => x.id !== existing.id); toast("Trade deleted"); render();
  }); });

  $("#save", ov).onclick = async () => {
    const err = $("#trade-err", ov); err.textContent = "";
    if (!coin) return err.textContent = "Pick a coin.";
    const q = dec(qty.value), p = dec(price.value), feeV = $("#fee", ov).value.trim() === "" ? 0 : dec($("#fee", ov).value);
    if (!(q > 0)) return err.textContent = "Quantity must be a number above 0 (e.g. 1500 or 0.25).";
    if (Number.isNaN(p) || p < 0 || price.value.trim() === "") return err.textContent = "Enter the price per coin as a number (e.g. 0.67).";
    if (Number.isNaN(feeV) || feeV < 0) return err.textContent = "Fee must be a number (or 0).";
    const when = $("#when", ov).value;
    if (!when) return err.textContent = "Enter the date and time.";
    if (new Date(when) > new Date(Date.now() + 5 * 60000)) return err.textContent = "Trade time can't be in the future.";
    if (side === "sell") {

// Member picks screenshots → we slice tall ones so text stays sharp → edge function reads them with
// Claude → we match each coin to CoinGecko here (member's own connection) → member confirms → buys saved.
const IMPORT_MAX_FILES = 5, IMPORT_MAX_SLICES = 10;
function loadImageFile(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(`Couldn't open ${file.name || "that image"}. Use a normal screenshot (PNG or JPG).`)); };
    img.src = url;
  });
}
async function screenshotSlices(file) {
  const img = await loadImageFile(file);
  const W = Math.min(img.naturalWidth, 1200), scale = W / img.naturalWidth, H = Math.round(img.naturalHeight * scale);
  const sliceH = Math.round(W * 1.3), overlap = Math.round(sliceH * 0.12), out = [];
  for (let y = 0; ; y += sliceH - overlap) {
    const h = Math.min(sliceH, H - y);
    const c = document.createElement("canvas"); c.width = W; c.height = h;
    const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, h);
    ctx.drawImage(img, 0, y / scale, img.naturalWidth, h / scale, 0, 0, W, h);
    out.push(c.toDataURL("image/jpeg", 0.85).split(",")[1]);
    if (y + h >= H) break;
  }

}
async function importSearch(q) {
  for (let i = 0; i < 3; i++) {
    try { const d = await CG.get(`/search?query=${encodeURIComponent(q)}`); return (d.coins || []).slice(0, 8).map(c => ({ id: c.id, name: c.name, symbol: c.symbol, image: c.thumb, rank: c.market_cap_rank })); }
    catch (e) { if (!/429/.test(e.message) || i === 2) return []; await new Promise(r => setTimeout(r, 2500 * (i + 1))); }
  }

}
const normName = (s) => String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
async function matchImportedCoins(rows, onProgress) {
  // Rows of the same coin (e.g. a transaction history) are matched once and share the result.
  const groups = new Map();
  for (const r of rows) { r.key = [r.coingecko_id_guess || "", String(r.symbol || "").toLowerCase(), normName(r.name)].join("|"); if (!groups.has(r.key)) groups.set(r.key, []); groups.get(r.key).push(r); }
  const reps = [...groups.values()].map(g => g[0]);
  await matchCoinsInner(reps, onProgress);
  for (const g of groups.values()) for (const r of g.slice(1)) { r.match = g[0].match; r.sure = g[0].sure; }
  return rows;
}
async function matchCoinsInner(rows, onProgress) {
  // 1) Claude's CoinGecko id guesses: verified in one batched call.
  const guesses = [...new Set(rows.map(r => r.coingecko_id_guess).filter(Boolean))];
  if (guesses.length) await CG.ensure(guesses, 5 * 60000);
  const priceOk = (id, r) => { const p = CG.info(id)?.price; if (!r.current_price || !p || CG.info(id)?.sample) return null; return Math.abs(p - r.current_price) / r.current_price < 0.25; };
  const toCoin = (id) => { const i = CG.info(id); return i && !i.sample ? { id, name: i.name, symbol: i.symbol, image: i.image } : null; };
  const pending = [];
  for (const r of rows) {
    const sym = String(r.symbol || "").toLowerCase(), g = r.coingecko_id_guess, info = g && toCoin(g);
    if (info && (!sym || info.symbol.toLowerCase() === sym) && priceOk(g, r) !== false) { r.match = info; r.sure = true; }
    else pending.push(r);
  }
  // 2) Everything else: search CoinGecko by name, then ticker; score; break ties with the price in the screenshot.
  let done = rows.length - pending.length; onProgress?.(done, rows.length);
  const allCand = new Set();
  for (const r of pending) {
    const sym = String(r.symbol || "").toLowerCase();
    let res = r.name ? await importSearch(r.name) : [];
    if (sym && !res.some(c => c.symbol.toLowerCase() === sym)) { const more = await importSearch(sym); res = res.concat(more.filter(c => !res.some(x => x.id === c.id))); }
    r.candidates = res.slice(0, 6); r.candidates.forEach(c => allCand.add(c.id));
    onProgress?.(++done, rows.length);
  }
  if (allCand.size) await CG.ensure([...allCand], 5 * 60000);
  for (const r of pending) {
    const sym = String(r.symbol || "").toLowerCase(), nm = normName(r.name);
    const scored = (r.candidates || []).map(c => {
      let s = 0;
      if (sym && c.symbol.toLowerCase() === sym) s += 4;
      const cn = normName(c.name);
      if (nm && cn === nm) s += 4; else if (nm && cn && (cn.includes(nm) || nm.includes(cn))) s += 1.5;
      s += c.rank ? 2 - Math.min(c.rank, 2000) / 1000 : 0;
      const po = priceOk(c.id, r); if (po === true) s += 4; else if (po === false) s -= 3;
      return { c, s, po };
    }).sort((a, b) => b.s - a.s);
    const best = scored[0];
    if (!best || best.s < 4) { r.match = null; r.sure = false; continue; }
    r.match = best.c;
    const symOk = !sym || best.c.symbol.toLowerCase() === sym, close = scored[1] && best.s - scored[1].s < 2;
    r.sure = symOk && (best.po === true || !close);
  }
  return rows;
}

// Trades paid in crypto (e.g. "0.05 ETH"): convert to USD with that coin's CoinGecko price on the trade day.
const IMPORT_STABLES = new Set(["USDT", "USDC", "DAI", "BUSD", "FDUSD", "TUSD", "USDE", "PYUSD", "USDS"]);
const IMPORT_BASE_IDS = { ETH: "ethereum", WETH: "weth", BTC: "bitcoin", WBTC: "wrapped-bitcoin", SOL: "solana", BNB: "binancecoin", AVAX: "avalanche-2", TON: "the-open-network", TRX: "tron", MATIC: "matic-network", POL: "polygon-ecosystem-token", ARB: "arbitrum", OP: "optimism", SUI: "sui" };
const importRateCache = {};
// Full daily history (no 1-year limit): Binance public market data first, then Coinbase. Average of the day's open and close (UTC).
async function exchangeDayPrice(cur, date) {
  const sym = { WETH: "ETH", WBTC: "BTC" }[cur] || cur;
  const [y, m, d] = date.split("-").map(Number), t0 = Date.UTC(y, m - 1, d);
  try {
    const r = await fetch(`https://data-api.binance.vision/api/v3/klines?symbol=${sym}USDT&interval=1d&startTime=${t0}&limit=1`);
    if (r.ok) { const k = (await r.json())[0]; if (k && k[0] === t0) return (Number(k[1]) + Number(k[4])) / 2; }
  } catch (e) {}
  try {
    const iso = (t) => new Date(t).toISOString();
    const r = await fetch(`https://api.exchange.coinbase.com/products/${sym}-USD/candles?granularity=86400&start=${iso(t0)}&end=${iso(t0 + 86400000)}`);
    if (r.ok) { const c = (await r.json()).find(x => x[0] * 1000 === t0); if (c) return (c[3] + c[4]) / 2; }
  } catch (e) {}
  return null;
}
async function usdRateOn(cur, date) {
  if (IMPORT_STABLES.has(cur)) return 1;
  const key = cur + "|" + date;
  if (key in importRateCache) return importRateCache[key];
  const ex = await exchangeDayPrice(cur, date);
  if (ex > 0) return (importRateCache[key] = ex);
  let id = IMPORT_BASE_IDS[cur];
  if (!id) id = (await importSearch(cur)).find(c => c.symbol.toUpperCase() === cur)?.id;
  let rate = null;
  if (id) for (let i = 0; i < 3; i++) {
    try { rate = await CG.historical(id, new Date(date + "T12:00")); break; }
    catch (e) { if (!/429/.test(e.message) || i === 2) break; await new Promise(r => setTimeout(r, 2500 * (i + 1))); }
  }
  return (importRateCache[key] = rate);
}
async function convertPaidTrades(rows) {
  for (const r of rows) {
    if (!r.paid || r.manualPrice) continue;
    const q = num(r.quantity);
    if (!r.date || !(q > 0)) { r.conv = { ok: false }; continue; }
    const rate = await usdRateOn(r.paid.currency, r.date);
    if (rate > 0) { r.avg_buy_price = r.paid.amount * rate / q; r.conv = { ok: true, rate }; }
    else { r.avg_buy_price = null; r.conv = { ok: false }; }
  }
}

// Parsed in the browser, then goes through the same coin matching and confirm step as screenshots.
// Accepts our own "Export CSV" file, CoinGecko/exchange exports, or a simple sheet: coin, quantity, buy price, date.
function parseCsvText(text) {
  text = String(text || "").replace(/^﻿/, "");
  const first = text.split(/\r?\n/).find(l => l.trim()) || "";
  const delim = [",", ";", "\t"].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim())).filter(r => r.some(c => c));
}
const CSV_COLS = {

  symbol: ["symbol", "ticker", "asset", "token", "currency"],
  name: ["name", "coinname", "assetname", "tokenname"],
  coin: ["coin", "crypto", "cryptocurrency"],
  quantity: ["quantity", "qty", "amount", "holdings", "balance", "units", "coins", "size"],
  price: ["priceusd", "price", "buyprice", "avgbuyprice", "averagebuyprice", "avgprice", "averageprice", "costpercoin", "pricepercoin", "entryprice", "entry", "avgcost"],
  total: ["totalusd", "total", "cost", "totalcost", "costbasis", "invested", "totalspent", "spent"],
  value: ["value", "valueusd", "currentvalue"],
  date: ["executedat", "date", "datetime", "time", "timestamp", "dateutc", "buydate", "purchasedate", "bought"],
  side: ["side", "type", "action", "transactiontype"],
  fee: ["feeusd", "fee", "fees"],
  exchange: ["exchange", "wallet", "platform"],
  note: ["note", "notes", "memo"],

function csvDate(s) {
  s = String(s || "").trim(); if (!s) return null;
  let m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
  m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/);
  if (m) {
    let [a, b, y] = [+m[1], +m[2], m[3].length === 2 ? "20" + m[3] : m[3]];
    const [mo, d] = a > 12 ? [b, a] : [a, b];   // 25/03/2024 → day first; otherwise month first
    return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  }

}
function csvToImport(text) {
  const grid = parseCsvText(text);
  if (grid.length < 2) throw new Error("That CSV looks empty. It needs a header row and at least one coin.");
  const head = grid[0].map(h => h.toLowerCase().replace(/[^a-z0-9]/g, ""));
  const col = {}; for (const [k, names] of Object.entries(CSV_COLS)) { const i = names.map(n => head.indexOf(n)).find(i => i >= 0); if (i != null) col[k] = i; }
  if (col.quantity == null) throw new Error("Couldn't find a quantity column. Name it \"quantity\" (or use the template).");
  if (col.coin_id == null && col.symbol == null && col.name == null && col.coin == null) throw new Error("Couldn't find a coin column. Name it \"coin\" (ticker or name), or use the template.");
  const get = (r, k) => col[k] != null ? (r[col[k]] ?? "").trim() : "";
  const n = (v) => { const x = dec(v); return v !== "" && Number.isFinite(x) ? Math.abs(x) : null; };
  const warnings = []; let skipped = 0;
  const items = grid.slice(1).map(r => {
    let symbol = get(r, "symbol"), name = get(r, "name");
    const coin = get(r, "coin");
    if (coin) { if (/^\$?[A-Z0-9.]{1,10}$/.test(coin) && !symbol) symbol = coin.replace(/^\$/, ""); else if (!name) name = coin; }
    const quantity = n(get(r, "quantity")), total = n(get(r, "total"));
    let price = n(get(r, "price")); if (price == null && total != null && quantity) price = total / quantity;
    const sideRaw = get(r, "side");
    return { name, symbol: symbol.toUpperCase(), coingecko_id_guess: get(r, "coin_id").toLowerCase() || null, quantity, price, value: n(get(r, "value")),
      date: csvDate(get(r, "date")), side: /sell/i.test(sideRaw) ? "sell" : "buy", fee: n(get(r, "fee")) || 0, exchange: get(r, "exchange") || null, note: get(r, "note") || null };
  }).filter(x => { const ok = (x.name || x.symbol || x.coingecko_id_guess) && x.quantity > 0; if (!ok) skipped++; return ok; });
  if (skipped) warnings.push(`${skipped} row${skipped === 1 ? " was" : "s were"} skipped (no coin or no quantity).`);
  if (!items.length) throw new Error("No coins with a quantity found in that CSV.");
  const dated = items.filter(x => x.date).length;
  if (col.date != null && dated >= items.length * 0.8) {
    return { source_app: "CSV", warnings, trades: items.map(x => ({ ...x, price_usd: x.price, total_usd: null, paid: null })) };
  }
  return { source_app: "CSV", warnings, holdings: items.map(x => ({ ...x, avg_buy_price: x.price, current_price: null })) };
}

        ${mode === "trades" ? "" : `<label class="field"><span>Bought around</span><input type="datetime-local" id="imp-when" value="${toLocalInput(new Date())}"></label>`}
        <label class="field"><span>Exchange / wallet</span><input type="text" id="imp-exch" maxlength="60" value="${esc(src && !/coingecko|coinmarketcap/i.test(src) ? src : "")}" placeholder="MEXC, Binance, Phantom…"></label>
      </div>
      ${mode === "trades" ? "" : `<div class="hint" style="margin-top:-6px">Every imported coin gets this date. You can fix individual dates later under Trades.</div>`}
      <div class="err" id="imp-err"></div>
      <div class="row" style="justify-content:space-between;align-items:center"><button class="link-btn" id="imp-again" type="button">${isCsv ? "Use a different file" : "Use different screenshots"}</button>
        <button class="btn primary" id="imp-save" style="flex:none"></button></div>`;
    paintRows();
    $("#imp-again", ov).onclick = () => stepPick();
    $("#imp-save", ov).onclick = save;
  }

  const isCsvR = () => result?.source_app === "CSV";
  function paintRows() {
    const list = $("#imp-rows", ov);
    list.innerHTML = rows.map((r, i) => {
      const shot = [r.symbol && String(r.symbol).toUpperCase(), r.name].filter(Boolean).join(" · ");
      const coin = r.match
        ? `<div class="picked" style="padding:6px 9px">${coinCell({ ...r.match, coin_id: r.match.id })}<button class="link-btn" type="button" data-change="${i}">Change</button></div>`
        : `<button class="btn" type="button" data-change="${i}" style="width:100%">Pick the coin</button>`;
      const flag = !r.match ? `<div class="hint" style="color:var(--bad)">Couldn't match “${esc(shot)}”. Pick it, or untick to skip.</div>`
        : !r.sure ? `<div class="hint" style="color:var(--bad)">Not 100% sure this is the right coin. Please check.</div>`
        : r.topUp ? `<div class="hint">You have ${fmtQty(r.heldQty)} logged and the screenshot shows ${fmtQty(r.shotQty)}, so only the extra ${fmtQty(r.quantity)} will be added.</div>`
        : r.alreadyHeld ? `<div class="hint">Already logged (you have ${fmtQty(r.heldQty)}), so it's unticked. Tick it only if this is a new buy on top.</div>` : "";
      if (mode === "trades") {
        const firstOfCoin = i === 0 || rows[i - 1].key !== r.key;
        const coinFlag = !r.match ? `<div class="hint" style="color:var(--bad);margin:-4px 0 8px">Couldn't match “${esc(shot)}”. Pick the coin.</div>`
          : !r.sure ? `<div class="hint" style="color:var(--bad);margin:-4px 0 8px">Not 100% sure this is the right coin. Please check.</div>` : "";
        const tot = num(r.quantity) * num(r.avg_buy_price);
        const paidHint = !r.paid ? "" : r.manualPrice ? `<div class="hint">Paid ${fmtQty(r.paid.amount)} ${esc(r.paid.currency)}</div>`
          : r.conv?.ok ? `<div class="hint">Paid ${fmtQty(r.paid.amount)} ${esc(r.paid.currency)} ≈ ${fmtUsd(r.paid.amount * r.conv.rate)} (${esc(r.paid.currency)} price that day)</div>`
          : `<div class="hint" style="color:var(--bad)">Paid ${fmtQty(r.paid.amount)} ${esc(r.paid.currency)}. Couldn't get that day's ${esc(r.paid.currency)} price, so enter the USD price per coin.</div>`;
        return `${firstOfCoin ? `<div style="margin:4px 0 8px">${coin}</div>${coinFlag}` : ""}<div class="card" style="padding:10px 12px;margin-bottom:10px;${r.include ? "" : "opacity:.6"}">
          <div style="display:flex;gap:10px;align-items:flex-start">
            <input type="checkbox" data-inc="${i}" ${r.include ? "checked" : ""} style="width:auto;margin-top:10px" aria-label="Import this trade">
            <div style="flex:1;min-width:0">
              <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span class="tag" style="color:var(--${r.side === "sell" ? "bad" : "good"})">${r.side === "sell" ? "Sell" : "Buy"}</span><input type="date" data-date="${i}" value="${esc(r.date || "")}" style="flex:1"></div>
              ${r.dup ? `<div class="hint" style="margin-bottom:6px">Looks already logged (same coin, day and amount), so it's unticked.</div>` : ""}
              ${r.preCC ? `<div class="hint" style="margin-bottom:6px">Before CC started (June 2023), so it's unticked. Tick it if you still want it.</div>` : ""}
              <div class="row">
                <label class="field" style="margin-bottom:0"><span>Quantity</span><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" data-qty="${i}" value="${r.quantity != null ? esc(+Number(r.quantity).toPrecision(10)) : ""}"></label>
                <label class="field" style="margin-bottom:0"><span>Price per coin (USD)</span><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" data-price="${i}" value="${r.avg_buy_price != null ? esc(+Number(r.avg_buy_price).toPrecision(8)) : ""}">${r.paid ? paidHint : tot ? `<div class="hint">Total ${fmtUsd(tot)}</div>` : ""}</label>
              </div>
            </div>
          </div></div>`;
      }
      const priceHint = r.avg_buy_price == null ? `<div class="hint">Not in ${isCsvR() ? "file" : "screenshot"}. Leave empty to use today's price.</div>` : "";
      return `<div class="card" style="padding:10px 12px;margin-bottom:10px;${r.include ? "" : "opacity:.6"}">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <input type="checkbox" data-inc="${i}" ${r.include ? "checked" : ""} style="width:auto;margin-top:10px" aria-label="Import this coin">
          <div style="flex:1;min-width:0">
            ${coin}
            <div class="muted" style="font-size:12px;margin:4px 0 6px">${isCsvR() ? "From CSV" : "From screenshot"}: ${esc(shot)}${r.value ? ` · ${fmtUsd(r.value)}` : ""}</div>
            ${flag}
            <div class="row" style="margin-top:6px">
              <label class="field" style="margin-bottom:0"><span>Quantity</span><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" data-qty="${i}" value="${r.quantity != null ? esc(+Number(r.quantity).toPrecision(10)) : ""}" placeholder="0.00">${r.quantity_estimated ? `<div class="hint">Worked out from value ÷ price. Check it.</div>` : ""}</label>
              <label class="field" style="margin-bottom:0"><span>Avg buy price (USD)</span><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" data-price="${i}" value="${r.avg_buy_price != null ? esc(+Number(r.avg_buy_price).toPrecision(8)) : ""}" placeholder="${r.match && CG.info(r.match.id)?.price ? "today: " + esc(fmtPrice(CG.info(r.match.id).price)) : "0.00"}">${priceHint}</label>
            </div>
          </div>
        </div></div>`;
    }).join("");
    list.querySelectorAll("[data-inc]").forEach(cb => cb.onchange = () => { rows[+cb.dataset.inc].include = cb.checked; paintRows(); });
    list.querySelectorAll("[data-qty]").forEach(inp => inp.oninput = () => { rows[+inp.dataset.qty].quantity = inp.value; });
    list.querySelectorAll("[data-price]").forEach(inp => inp.oninput = () => { const r = rows[+inp.dataset.price]; r.avg_buy_price = inp.value === "" ? null : inp.value; r.manualPrice = inp.value !== ""; });
    list.querySelectorAll("[data-date]").forEach(inp => inp.onchange = async () => {
      const r = rows[+inp.dataset.date]; r.date = inp.value || null;
      applyDup(r); if (!r.dup && !r.preCC && r.match) r.include = true;
      if (r.paid && !r.manualPrice) await convertPaidTrades([r]);   // re-price with the new day's rate
      paintRows();
    });
    list.querySelectorAll("[data-change]").forEach(b => b.onclick = () => openCoinPicker(async (c) => {
      const r = rows[+b.dataset.change], m = { id: c.id, name: c.name, symbol: c.symbol, image: c.image };
      if (mode === "trades") { for (const x of rows) if (x.key === r.key) { x.match = m; x.sure = true; x.include = true; applyDup(x); } }
      else {
        r.match = m; r.sure = true;
        if (r.shotQty != null) r.quantity = r.shotQty;
        applyHeld(r); if (!r.alreadyHeld) r.include = true;
      }
      await CG.ensure([c.id]); paintRows();
    }));
    const n = rows.filter(r => r.include).length, btn = $("#imp-save", ov);
    if (btn) { btn.textContent = n ? `Import ${n} ${mode === "trades" ? "trade" : "coin"}${n === 1 ? "" : "s"}` : "Nothing selected"; btn.disabled = !n; }
  }

  async function save() {
    const err = $("#imp-err", ov); err.textContent = "";
    const when = mode === "trades" ? null : $("#imp-when", ov).value;
    if (mode !== "trades") {
      if (!when) return err.textContent = "Enter roughly when you bought.";
      if (new Date(when) > new Date(Date.now() + 5 * 60000)) return err.textContent = "The date can't be in the future.";
    }
    const picked = rows.filter(r => r.include);
    await CG.ensure(picked.filter(r => r.match).map(r => r.match.id));
    const out = [];
    for (const r of picked) {
      const label = String(r.match?.symbol || r.symbol || r.name || "a coin").toUpperCase();
      if (!r.match) return err.textContent = `Pick the right coin for ${label}, or untick it.`;
      const q = dec(r.quantity);
      if (!(q > 0)) return err.textContent = `Enter the quantity for ${label} as a number (e.g. 1500 or 0.25).`;
      let p = r.avg_buy_price == null || r.avg_buy_price === "" ? null : dec(r.avg_buy_price), usedToday = false;
      if (p != null && (Number.isNaN(p) || p < 0)) return err.textContent = `Enter ${label}'s buy price as a number (e.g. 0.67).`;
      let at = when ? new Date(when) : null;
      if (mode === "trades") {
        if (!r.date) return err.textContent = `Enter the date for the ${label} ${r.side} of ${fmtQty(q)}.`;
        at = new Date(r.date + "T12:00");
        if (at > new Date(Date.now() + 86400000)) return err.textContent = `The ${label} trade on ${r.date} is in the future.`;
        if (p == null) return err.textContent = `Enter the price for the ${label} ${r.side} on ${r.date}.`;
      }
      if (p == null) { p = CG.info(r.match.id)?.price; usedToday = true; if (!(p > 0)) return err.textContent = `No live price for ${label} right now. Enter its buy price.`; }
      out.push({ coin_id: r.match.id, symbol: r.match.symbol, name: r.match.name, side: mode === "trades" ? r.side : "buy", quantity: q, price_usd: p, fee_usd: num(r.fee),
        executed_at: at.toISOString(), exchange: r.exchange || $("#imp-exch", ov).value.trim() || null,
        note: r.note || (isCsvR() ? `Imported from CSV${usedToday ? " (no buy price; used price on import day)" : ""}`
          : `Imported from ${result.source_app && !/unknown/i.test(result.source_app) ? result.source_app + " " : ""}screenshot${usedToday ? " (buy price not shown; used price on import day)" : ""}`) });
    }
    const btn = $("#imp-save", ov); btn.disabled = true; btn.textContent = "Importing…";
    try {
      const saved = await api.addTxs(out);
      S.txs.push(...saved); ov.remove();
      toast(`Imported ${saved.length} ${mode === "trades" ? "trade" : "coin"}${saved.length === 1 ? "" : "s"}`);
      if (location.hash.replace("#", "") === "overview") render(); else location.hash = "overview";
    } catch (e) { btn.disabled = false; paintRows(); err.textContent = e.message || "Couldn't save. Try again."; }
  }

  stepPick();
}
function confirmModal(title, body, onYes) {

function threadHtml(msgs, viewerId, memberId, names) {
  if (!msgs.length) return `<div class="empty">No messages yet.</div>`;
  return msgs.map(m => {
    const fromReviewer = m.author_id !== memberId;
    const mine = m.author_id === viewerId;
    const who = fromReviewer ? (names?.[m.author_id] || CONFIG.REVIEWER_NAME) : (mine ? "You" : names?.[m.author_id] || "Member");
    const kindTag = m.kind && m.kind !== "note" && m.kind !== "reply" ? `<span class="tag">${esc(m.kind)}</span>` : "";
    const coinTag = m.coin_id ? `<a class="tag" href="${coinLink(m.coin_id)}" target="_blank" rel="noopener">${esc((CG.info(m.coin_id)?.symbol || m.coin_id).toUpperCase())}</a>` : "";
    return `<div class="msg ${mine ? "mine" : ""} ${fromReviewer ? "reviewer" : ""}"><div class="meta"><b>${esc(who)}</b>${kindTag}${coinTag}<span>${ago(m.created_at)}</span>${mine ? `<button class="link-btn" data-delmsg="${esc(m.id)}" style="font-size:12px;color:var(--text-muted)">delete</button>` : ""}</div>${esc(m.body)}</div>`;
  }).join("");
}

/* ===================== PROJECTIONS ===================== */
const PROJ_MULTS = [2, 3, 5, 10, 25, 50, 100];
function projFromPortfolio() {
  const pf = computePortfolio(S.txs);
  return pf.holdings.map(h => ({ id: uid(), coin_id: h.coin_id, symbol: h.symbol, name: h.name, image: h.image, own: true, qty: h.qty, cost: h.cost, invest: "", entry: "", target: "", mult: "" }));
}
function projRowCalc(r) {
  const now = CG.info(r.coin_id)?.price ?? 0;
  let qty = r.qty, cost = r.cost;
  if (!r.own) {
    const entry = r.entry !== "" && !Number.isNaN(dec(r.entry)) ? dec(r.entry) : now;
    const inv = decOr0(r.invest);
    qty = entry > 0 ? inv / entry : 0; cost = inv;
  }
  let target = r.target !== "" ? dec(r.target) : NaN;
  if (Number.isNaN(target) && r.mult !== "" && !Number.isNaN(dec(r.mult))) target = now * dec(r.mult);
  if (Number.isNaN(target)) target = now;
  const valueNow = qty * now, valueProj = qty * target;
  const mcap = CG.info(r.coin_id)?.mcap;
  return { now, qty, cost, target, valueNow, valueProj, gainVsNow: valueProj - valueNow, profit: valueProj - cost, roi: cost > 0 ? (valueProj - cost) / cost * 100 : 0, mult: now > 0 ? target / now : 0, mcapAtTarget: mcap && now > 0 ? mcap * target / now : null };
}
function openCoinPicker(onPick) {
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>Add a coin <button class="x" aria-label="Close">×</button></h2>
    <div class="search-wrap"><input type="search" enterkeyhint="done" id="pick-q" placeholder="Name, ticker, or CoinGecko link" autocomplete="off"><div class="dropdown hidden" id="pick-dd"></div></div>
    <div class="hint">Searches CoinGecko.</div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector(".x").onclick = close; ov.addEventListener("click", e => { if (e.target === ov) close(); });
  const q = $("#pick-q", ov), dd = $("#pick-dd", ov); q.focus();
  q.oninput = debounce(async () => {
    let s = q.value.trim(); const m = s.match(/coingecko\.com\/(?:[a-z]{2}\/)?coins\/([a-z0-9-]+)/i); if (m) s = m[1];
    if (s.length < 2) { dd.classList.add("hidden"); return; }
    dd.classList.remove("hidden"); dd.innerHTML = `<div class="opt muted">Searching…</div>`;
    const res = await CG.search(s);
    if (!res.length) { dd.innerHTML = `<div class="opt muted">No coins found.</div>`; return; }
    dd.innerHTML = res.map((c, i) => `<div class="opt" data-i="${i}">${coinCell({ ...c, coin_id: c.id }, true)}<span class="muted" style="font-size:12px">${c.rank ? "#" + c.rank : ""}</span></div>`).join("");
    dd.querySelectorAll(".opt[data-i]").forEach(o => o.onclick = () => { close(); onPick(res[+o.dataset.i]); });
  }, 350);
}

  paintProj();
