function paintProj() {
  if (!$("#pj-kpis")) return;
  const rows = S.proj.rows, calcs = rows.map(projRowCalc);
  const T = calcs.reduce((a, c) => ({ now: a.now + c.valueNow, proj: a.proj + c.valueProj, cost: a.cost + c.cost }), { now: 0, proj: 0, cost: 0 });
  const profit = T.proj - T.cost;
  $("#pj-kpis").innerHTML = rows.length ? `<div class="kpis">
    <div class="card kpi"><div class="label">Value today</div><div class="value num">${fmtUsd(T.now)}</div><div class="sub muted">at live CoinGecko prices</div></div>
    <div class="card kpi"><div class="label">Projected value</div><div class="value num">${fmtUsd(T.proj, { compact: true })}</div><div class="sub num">${T.now > 0 ? (T.proj / T.now).toFixed(2) + "× today" : "—"}</div></div>
    <div class="card kpi"><div class="label">Projected profit</div><div class="value num ${signCls(profit)}">${fmtUsd(profit, { compact: true })}</div><div class="sub muted">vs what you paid / put in</div></div>
    <div class="card kpi"><div class="label">Return on cost</div><div class="value num ${signCls(profit)}">${T.cost > 0 ? fmtPct(profit / T.cost * 100) : "—"}</div><div class="sub muted">${T.cost > 0 ? (T.proj / T.cost).toFixed(2) + "× your money" : ""}</div></div>
  </div>` : "";
  const pieRows = rows.map((r, i) => ({ coin_id: r.coin_id, symbol: r.symbol, name: r.name, value: calcs[i].valueProj })).filter(h => h.value > 0).sort((a, b) => b.value - a.value);
  pieRows.forEach(h => h.alloc = T.proj > 0 ? h.value / T.proj * 100 : 0);

/* ===================== MODEL PORTFOLIO (Dkay's target mix) ===================== */
// TET and ACN are fixed. The rest (30%) is a flexible pool the member splits between PAAL, VELO and OTK.
const DEFAULT_MODEL = {
  version: 2,
  fixed: [
    { coin: "tectum", label: "Tectum (TET)", pct: 40 },
    { coin: "solidus-aitech", label: "AITECH (ACN)", pct: 30 },
  ],
  flex: [
    { coin: "paal-ai", max: 30 },
    { coin: "velo", max: 30 },
    { coin: "octo-gaming", max: 10 },
  ],
  presets: [
    { name: "Even split", mix: { "paal-ai": 10, "velo": 10, "octo-gaming": 10 } },
    { name: "PAAL-heavy", mix: { "paal-ai": 20, "velo": 10, "octo-gaming": 0 } },
    { name: "All PAAL", mix: { "paal-ai": 30, "velo": 0, "octo-gaming": 0 } },
  ],
  drift: 2,     // % points before we suggest a trade
  drop24: 15,   // urgent-bid alert: 24h drop of this % or more
  drop7: 25,    // ...or 7-day drop of this % or more
};
const STABLE_IDS = ["tether", "usd-coin", "dai", "first-digital-usd", "ethena-usde"];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const r1 = (v) => Math.round(v * 10) / 10;
function getModel() { return S.model || DEFAULT_MODEL; }
function poolSize(m = getModel()) { return Math.max(0, 100 - m.fixed.reduce((s, f) => s + num(f.pct), 0)); }
function modelCoinIds(m = getModel()) { return [...new Set([...m.fixed.map(f => f.coin), ...m.flex.map(f => f.coin)])]; }
function symOf(id) { const i = CG.info(id); return ((i && i.symbol) || SAMPLE_PRICES[id]?.symbol || id).toUpperCase(); }
/** Make a flex mix add up to the pool, respecting each coin's max. `keep` is the coin the member just moved. */
function normalizeMix(m, mix, keep) {
  const pool = poolSize(m), cap = (f) => Math.min(num(f.max) || pool, pool), out = {};
  for (const f of m.flex) out[f.coin] = clamp(num(mix[f.coin]), 0, cap(f));
  const fixed = new Set(keep ? [keep] : []);
  for (let pass = 0; pass < 12; pass++) {
    const gap = pool - m.flex.reduce((s, f) => s + out[f.coin], 0);
    if (Math.abs(gap) < 1e-6) break;
    const adj = m.flex.filter(f => !fixed.has(f.coin) && (gap > 0 ? out[f.coin] < cap(f) - 1e-9 : out[f.coin] > 1e-9));
    if (!adj.length) { if (fixed.size) { fixed.clear(); continue; } break; }
    const w = adj.map(f => gap > 0 ? cap(f) - out[f.coin] : out[f.coin]), W = w.reduce((s, x) => s + x, 0) || 1;
    adj.forEach((f, i) => { out[f.coin] = clamp(out[f.coin] + gap * w[i] / W, 0, cap(f)); });
  }
  for (const k in out) out[k] = r1(out[k]);
  const drift = r1(pool - Object.values(out).reduce((s, x) => s + x, 0));
  if (drift && m.flex.length) { const big = m.flex.filter(f => f.coin !== keep).sort((a, b) => out[b.coin] - out[a.coin])[0] || m.flex[0]; out[big.coin] = r1(out[big.coin] + drift); }
  return out;
}
function presetIndex(prefs) { return prefs && Number.isInteger(prefs.preset) ? prefs.preset : null; }
/** The member's flex mix: their custom mix, else their chosen preset, else the first preset. */
function memberMix(m, prefs = {}) {
  if (prefs.mix && !Number.isInteger(prefs.preset)) return normalizeMix(m, prefs.mix);
  const p = m.presets[presetIndex(prefs) ?? 0] || m.presets[0];
  return normalizeMix(m, p ? p.mix : {});
}
function mixLabel(m, prefs = {}) {
  if (prefs.mix && !Number.isInteger(prefs.preset)) return "Custom split";
  return (m.presets[presetIndex(prefs) ?? 0] || {}).name || "Default";
}
/** Per-coin target % for a member. */
function modelTargets(m, prefs = {}) {
  const coins = {};
  for (const f of m.fixed) coins[f.coin] = (coins[f.coin] || 0) + num(f.pct);
  const mix = memberMix(m, prefs);
  for (const f of m.flex) coins[f.coin] = (coins[f.coin] || 0) + num(mix[f.coin]);
  return { coins, mix };
}
/**
 * Build an add-only plan (CC only adds). Coins outside the model are left out.
 * `need` = what each coin needs to reach its target without selling anything.
 * With new money, it fills the biggest gaps first, then follows the target mix.
 */
function modelPlan(pf, m, prefs, { newMoney = 0 } = {}) {
  const T = modelTargets(m, prefs);
  const val = {}; for (const h of pf.holdings) val[h.coin_id] = h.value;
  const cashNow = STABLE_IDS.reduce((s, id) => s + (val[id] || 0), 0);
  const ids = Object.keys(T.coins);
  const others = pf.holdings.filter(h => !(h.coin_id in T.coins));
  const otherVal = others.reduce((s, h) => s + h.value, 0);
  const baseNow = ids.reduce((s, id) => s + (val[id] || 0), 0);
  const money = Math.max(0, newMoney);
  // Smallest total where every coin can sit at its target without selling.
  const fullBase = Math.max(baseNow, ...ids.filter(id => T.coins[id] > 0).map(id => (val[id] || 0) / (T.coins[id] / 100)));
  const rows = ids.map(id => {
    const h = pf.holdings.find(x => x.coin_id === id);
    const info = CG.info(id);
    const now = val[id] || 0;
    return { id, symbol: symOf(id), name: info?.name || h?.name || id, image: info?.image, price: info?.price ?? h?.price ?? 0,
      target: T.coins[id], now, need: Math.max(0, fullBase * T.coins[id] / 100 - now), change24: info?.change24, change7: info?.change7 };
  });
  const needSum = rows.reduce((s, r) => s + r.need, 0);
  for (const r of rows) {
    r.nowPct = baseNow > 0 ? r.now / baseNow * 100 : 0;
    r.gapAfter = Math.max(0, (baseNow + money) * r.target / 100 - r.now);
    r.targetVal = (baseNow + money) * r.target / 100;
  }
  // New money goes only to coins that are below target at the new total, in proportion to how far below they are.
  const gapSum = rows.reduce((s, r) => s + r.gapAfter, 0);
  for (const r of rows) {
    r.action = money > 0 && gapSum > 0 ? r.gapAfter * Math.min(1, money / gapSum) : 0;
    r.qty = r.price > 0 ? r.action / r.price : 0;
    r.afterPct = baseNow + money > 0 ? (r.now + r.action) / (baseNow + money) * 100 : 0;
  }
  return { T, rows, baseNow, needSum, money, others, otherVal, cashNow };
}
function myPrefs() { return S.me?.model_prefs || {}; }
function planFor(p, pf, opts) { return modelPlan(pf, getModel(), p?.model_prefs || {}, opts); }

/* ===================== MARKET ALERTS ===================== */
function priceDrops(m = getModel()) {
  const out = [];
  for (const id of modelCoinIds(m)) {
    const i = CG.info(id); if (!i) continue;
    const d24 = num(i.change24), d7 = num(i.change7);
    if (d24 <= -m.drop24 || (i.change7 != null && d7 <= -m.drop7)) out.push({ id, symbol: symOf(id), name: i.name, image: i.image, price: i.price, change24: d24, change7: i.change7 });
  }
  return out;
}
function activeUrgent() {
  const now = Date.now();
  return (S.updates || []).filter(u => u.kind === "urgent" && (!u.expires_at || new Date(u.expires_at) > now));
}
function alertCount() { return activeUrgent().length + priceDrops().length; }
/** Suggested $ for an urgent bid: fill the member's gap on that coin, paid from dry powder if they have it. */
function bidSuggestion(coinId) {
  const pf = computePortfolio(S.txs);
  const plan = planFor(S.me, pf, {});
  const r = plan.rows.find(x => x.id === coinId);
  if (!r) return { text: "Not part of the model mix.", amount: 0 };
  const gap = Math.max(0, r.targetVal - r.now);
  if (!plan.baseNow) return { text: `No holdings logged yet. ${symOf(coinId)} is ${r.target.toFixed(1)}% of the model mix.`, amount: 0 };
  if (gap < 1) return { text: `You're already at or above your ${r.target.toFixed(1)}% target for ${symOf(coinId)}.`, amount: 0 };
  const fromCash = Math.min(gap, plan.cashNow);
  return { amount: gap, text: `You're ${fmtUsd(gap)} under your ${r.target.toFixed(1)}% target (${r.nowPct.toFixed(1)}% now).` +
    (fromCash > 0 ? ` You have ${fmtUsd(plan.cashNow)} in stables to bid with.` : " You have no stables logged, so this would be new money.") };
}

async function groupTotals() {
  const rows = await api.groupHoldings();
  await CG.ensure(rows.map(r => r.coin_id));
  let value = 0, chg = 0;
  for (const r of rows) { const i = CG.info(r.coin_id); if (!i) continue; const v = num(r.qty) * num(i.price); value += v; chg += v - v / (1 + num(i.change24) / 100); }

}

}

  const bindPresets = () => $("#presets").querySelectorAll("[data-p]").forEach(c => { if (c.dataset.p !== "custom") c.onclick = () => {

/** Compact model-drift card for Dkay on a member's page. */
function driftCard(p, pf) {
  if (!pf.holdings.length) return "";
  const m = getModel(), plan = planFor(p, pf, {});
  const off = plan.rows.filter(r => Math.abs(r.nowPct - r.target) >= (m.drift ?? 2));
  return `<div class="card" style="margin-top:16px"><h2>Model drift <span class="muted" style="font-weight:400;font-size:13px">· their mix: ${esc(mixLabel(m, p.model_prefs || {}))} (${m.flex.map(f => `${esc(symOf(f.coin))} ${num(plan.T.mix[f.coin]).toFixed(0)}%`).join(", ")})${plan.others.length ? ` · ${fmtUsd(plan.otherVal)} outside the model` : ""}</span></h2>
    ${off.length ? "" : `<div class="secondary" style="margin-bottom:8px">On target: every position is within ${m.drift ?? 2}% of the model.</div>`}
    ${planTable(plan, m)}</div>`;
}

function getTps() { return (S.model && Array.isArray(S.model.tps) && S.model.tps.length ? S.model.tps : DEFAULT_TPS); }
function tpLevels(tp) {

  if (num(tp.min)) L.push({ k: "min", label: "Bare minimum", price: num(tp.min) });
  if (num(tp.lo)) L.push({ k: "lo", label: "Ideal low", price: num(tp.lo) });
  if (num(tp.lo) && num(tp.hi)) L.push({ k: "mid", label: "Ideal mid", price: (num(tp.lo) + num(tp.hi)) / 2 });
  if (num(tp.hi)) L.push({ k: "hi", label: "Ideal high", price: num(tp.hi) });

}
function tpFor(coinId, symbol) {

const round5 = (v) => Math.max(0, Math.round(v / 5) * 5);
/** Suggested steps (percent of the position) for a strategy. */
function presetSteps(tp, strategy, h) {

  if (!L.length) return [{ k: "custom", price: 0, pct: 25 }];
  if (strategy === "even") {
    const each = round5(80 / L.length) || 5;
    return L.map(l => ({ k: l.k, pct: each }));

  if (strategy === "ride") {
    const w = L.map((_, i) => i + 1), W = w.reduce((s, x) => s + x, 0);

  const first = L[0];

  if (h && h.qty > 0 && h.cost > 0 && first.price > 0) init = Math.min(60, Math.max(5, Math.ceil(h.cost / (h.qty * first.price) * 100 / 5) * 5));

function fixTotal(steps, total) {

function stepPrice(tp, st) { if (st.k === "custom") return num(st.price); const l = (tp ? tpLevels(tp) : []).find(x => x.k === st.k); return l ? l.price : num(st.price); }

      card.querySelector("[data-add]")?.addEventListener("click", () => { const L = c.tp ? tpLevels(c.tp) : []; const used = new Set(cp.steps.map(s => s.k)); const next = L.find(l => !used.has(l.k)); cp.steps.push(next ? { k: next.k, pct: 10 } : { k: "custom", price: 0, pct: 10 }); cp.strategy = "custom"; repaintCoins(); touch(); });
    });
  };
  const repaintCoins = () => { coins = exitCoins(pf, plan); $("#ex-coins").innerHTML = coins.map(coinCard).join(""); bind(); paintAdd(); };
  const addCoin = async (id, sym) => {
    if (!id) return;
    if (!plan.coins[id] && !coins.some(c => c.id === id && c.h)) {
      await CG.ensure([id]);
      const tp = tpFor(id, sym || CG.info(id)?.symbol);
      plan.coins[id] = { strategy: tp ? "initials" : "custom", steps: presetSteps(tp, "initials", null), sym: String(sym || CG.info(id)?.symbol || tp?.sym || "").toUpperCase() };
      touch();
    }
    repaintCoins();
    const card = v.querySelector(`.exit-card[data-coin="${CSS.escape(id)}"]`) || v.querySelector(`[data-plan="${CSS.escape(id)}"]`);
    if (card) { card.scrollIntoView({ behavior: "smooth", block: "center" }); toast(`${symOf(id)} added with a suggested plan`); }
  };
  const paintAdd = () => {
    const shown = new Set(coins.map(c => c.id)), shownTps = new Set(coins.map(c => c.tp).filter(Boolean));
    const opts = getTps().filter(t => t.coin && !shown.has(t.coin) && !shownTps.has(t));
    const sel = $("#ex-add-sel"), btn = $("#ex-add-btn");
    sel.innerHTML = opts.length ? `<option value="">Select a coin</option>` + opts.map(t => `<option value="${esc(t.coin)}" data-sym="${esc(t.sym)}">${esc(t.sym || nameSym(t.label))}${t.main ? "" : " (other)"}</option>`).join("") : `<option value="">All of ${esc(CONFIG.REVIEWER_NAME)}'s target coins are in your plan</option>`;
    sel.disabled = !opts.length; btn.disabled = !opts.length;
  };
  $("#ex-add-btn").onclick = () => { const sel = $("#ex-add-sel"); if (!sel.value) return sel.focus(); addCoin(sel.value, sel.selectedOptions[0]?.dataset.sym); };
  { const q = $("#ex-add-q"), dd = $("#ex-add-dd");
    const run = debounce(async () => {
      let s = q.value.trim(); const m = s.match(/coingecko\.com\/(?:[a-z]{2}\/)?coins\/([a-z0-9-]+)/i); if (m) s = m[1];
      if (s.length < 2) { dd.classList.add("hidden"); return; }
      dd.classList.remove("hidden"); dd.innerHTML = `<div class="opt muted">Searching…</div>`;
      const res = (await CG.search(s)).filter(c => !STABLE_IDS.includes(c.id));
      if (!res.length) { dd.innerHTML = `<div class="opt muted">No coins found.</div>`; return; }
      dd.innerHTML = res.map((c, i) => `<div class="opt" data-i="${i}">${coinCell({ ...c, coin_id: c.id }, true)}<span class="muted" style="font-size:12px">${coins.some(x => x.id === c.id) ? "in your plan" : tpFor(c.id, c.symbol) ? "has targets" : c.rank ? "#" + c.rank : ""}</span></div>`).join("");
      dd.querySelectorAll(".opt[data-i]").forEach(o => o.onclick = () => { const c = res[+o.dataset.i]; q.value = ""; dd.classList.add("hidden"); q.blur(); addCoin(c.id, c.symbol); });
    }, 350);
    q.oninput = run;
  }
  $("#ex-goal").oninput = debounce(e => { plan.goal = Math.max(0, decOr0(e.target.value)) || null; touch(); }, 300);
  v.querySelectorAll("[data-pledge]").forEach(cb => cb.onchange = () => { plan.pledges[cb.dataset.pledge] = cb.checked; touch(); });
  $("#ex-commit").onclick = async () => {
    const missing = EXIT_PLEDGES.filter(([k]) => !plan.pledges[k]);
    const planned = coins.filter(c => plan.coins[c.id] && c.h);
    const over = planned.filter(c => exitCalc(c.tp, plan.coins[c.id], c.h).over);
    $("#ex-err").textContent = "";
    if (!planned.length) return $("#ex-err").textContent = "Plan at least one coin you hold first.";
    if (over.length) return $("#ex-err").textContent = `Your ${over.map(c => symOf(c.id)).join(", ")} plan sells more than 100%.`;
    if (missing.length) return $("#ex-err").textContent = `Tick all ${EXIT_PLEDGES.length} rules to commit (${missing.length} left).`;
    if (!num(plan.goal)) return $("#ex-err").textContent = "Set your money goal first.";
    try { const now = new Date().toISOString(); plan.updated_at = now; plan.committed_at = now; S.me = await api.updateProfile(S.me.id, { exit_plan: plan }); dirty = false; paintStatus(); toast("Exit plan committed. Stick to it!"); }
    catch (e) { $("#ex-err").textContent = e.message; }
  };
  bind(); paintAdd(); paintSummary(); paintStatus();
}
/** Dkay's read-only view of a member's exit plan. */
function exitCard(p, pf) {
  const st = exitStatus(p), ep = p.exit_plan;
  if (!ep || !ep.coins || !Object.keys(ep.coins).length) return `<div class="card" style="margin-top:16px"><h2>Exit plan</h2><div class="secondary">${esc(memberName(p))} hasn't made an exit plan yet.</div></div>`;
  const lines = Object.entries(ep.coins).map(([id, cp]) => {
    const h = pf.holdings.find(x => x.coin_id === id), tp = tpFor(id, h?.symbol || cp.sym), k = exitCalc(tp, cp, h);
    return `<tr><td><b>${esc(symOf(id))}</b></td><td>${k.rows.map(r => `${r.pct}% @ ${fmtPrice(r.price)}`).join(" · ") || "—"}</td><td class="r num">${k.keep}%</td><td class="r num">${h ? fmtUsd(k.total, { compact: k.total >= 1e6 }) : "—"}</td><td>${h?.cost ? (k.initialsAt != null ? '<span class="good">yes</span>' : '<span class="bad">no</span>') : "—"}</td></tr>`;
  }).join("");
  return `<div class="card" style="margin-top:16px"><h2>Exit plan <span class="tag ${st.state === "committed" ? "buy" : st.state === "edited" ? "req" : "flag"}" style="margin-left:6px">${esc(st.label)}</span></h2>

}

// One message, delivered privately into each chosen member's own Feedback thread (and pinged on Telegram).
function openBroadcast() {
  const rows = memberRows();
  const m = getModel();
  const offTarget = (r) => r.pf.holdings.length && planFor(r.p, r.pf, {}).rows.some(x => Math.abs(x.nowPct - x.target) >= (m.drift ?? 2));
  const coins = {};
  for (const r of rows) for (const h of r.pf.holdings) (coins[h.coin_id] ||= { id: h.coin_id, symbol: (h.symbol || "").toUpperCase(), n: 0 }).n++;
  // The big five (model coins) are always on the list, first, even with 0 holders.
  const big = modelCoinIds(m);
  const coinList = [...big.map(id => coins[id] || { id, symbol: symOf(id), n: 0 }), ...Object.values(coins).filter(c => !big.includes(c.id)).sort((a, b) => b.n - a.n)];
  const AUD = [
    ["all", "All members", () => true],
    ["holders", "Members holding a coin…", (r, c) => r.pf.holdings.some(h => h.coin_id === c)],
    ["off", "Off the model by more than " + (m.drift ?? 2) + "%", offTarget],
    ["requested", "Open review requests", (r) => r.p.review_requested],
    ["empty", "No trades logged yet", (r) => !r.txs.length],
    ["noexit", "No exit plan committed yet", (r) => exitStatus(r.p).state !== "committed"],
    ["pick", "Pick members…", (r, c, picked) => picked.has(r.p.id)],
  ];
  const picked = new Set();
  const ov = document.createElement("div"); ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" style="max-width:560px"><h2>📣 Broadcast <button class="x" aria-label="Close">×</button></h2>
    <p class="secondary" style="margin-top:0">One message, sent privately to each member. It lands in their own Feedback thread (they can reply 1-on-1) and pings them on Telegram if linked.</p>
    <label class="field"><span>Send to</span><select id="bc-aud">${AUD.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join("")}</select></label>
    <label class="field hidden" id="bc-coin-wrap"><span>Coin</span><select id="bc-coin">${coinList.map((c, i) => `${i === big.length && i ? `<option disabled>──────────</option>` : ""}<option value="${esc(c.id)}">${big.includes(c.id) ? "★ " : ""}${esc(c.symbol)} · ${c.n} holder${c.n === 1 ? "" : "s"}</option>`).join("")}</select></label>
    <div class="hidden" id="bc-pick" style="margin-bottom:12px"><input type="search" enterkeyhint="done" id="bc-q" placeholder="Search members" style="margin-bottom:6px">
      <div id="bc-list" style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:9px;padding:4px 8px"></div></div>
    <label class="field"><span>Type</span><select id="bc-kind"><option value="note">Note</option><option value="suggestion">Suggestion</option></select></label>
    <label class="field"><span>Message</span><textarea id="bc-body" rows="6" maxlength="4000" placeholder="Hey {name}, quick heads-up…"></textarea></label>
    <div class="hint" style="margin-top:-6px">Type <b>{name}</b> and each member sees their own name.</div>
    <div class="callout" id="bc-count" style="margin:12px 0"></div>
    <div class="err" id="bc-err"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="bc-cancel" style="flex:none">Cancel</button><button class="btn primary" id="bc-send" style="flex:none">Send</button></div></div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector(".x").onclick = close; $("#bc-cancel", ov).onclick = close;
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  const targets = () => {
    const a = $("#bc-aud", ov).value, fn = AUD.find(x => x[0] === a)[2], c = $("#bc-coin", ov).value;
    return rows.filter(r => fn(r, c, picked));
  };
  const paintList = () => {
    const q = $("#bc-q", ov).value.toLowerCase();
    $("#bc-list", ov).innerHTML = rows.filter(r => !q || memberName(r.p).toLowerCase().includes(q) || (r.p.telegram_handle || "").toLowerCase().includes(q))
      .map(r => `<label style="display:flex;gap:8px;align-items:center;padding:5px 0;cursor:pointer"><input type="checkbox" data-id="${esc(r.p.id)}" ${picked.has(r.p.id) ? "checked" : ""} style="width:auto"> ${esc(memberName(r.p))} <span class="muted" style="font-size:12px">${r.p.telegram_handle ? "@" + esc(r.p.telegram_handle.replace(/^@/, "")) : ""}</span></label>`).join("") || `<div class="muted" style="padding:6px 0">No members match.</div>`;
    $("#bc-list", ov).querySelectorAll("[data-id]").forEach(cb => cb.onchange = () => { cb.checked ? picked.add(cb.dataset.id) : picked.delete(cb.dataset.id); paintCount(); });
  };
  const paintCount = () => {
    const t = targets(), tg = t.filter(r => r.p.telegram_chat_id).length;
    $("#bc-count", ov).innerHTML = t.length ? `<b>${t.length}</b> member${t.length === 1 ? "" : "s"} will get this privately${api.demo ? "" : ` · <b>${tg}</b> on Telegram`}.${t.length <= 6 ? `\n${t.map(r => esc(memberName(r.p))).join(", ")}` : ""}` : "Nobody matches yet.";
    $("#bc-send", ov).textContent = t.length ? `Send to ${t.length}` : "Send";
    $("#bc-send", ov).disabled = !t.length;
  };
  $("#bc-aud", ov).onchange = () => {
    const a = $("#bc-aud", ov).value;
    $("#bc-coin-wrap", ov).classList.toggle("hidden", a !== "holders");
    $("#bc-pick", ov).classList.toggle("hidden", a !== "pick");
    if (a === "pick") paintList();
    paintCount();
  };
  $("#bc-coin", ov).onchange = paintCount;
  $("#bc-q", ov).oninput = debounce(paintList, 120);
  $("#bc-send", ov).onclick = async () => {
    const body = $("#bc-body", ov).value.trim(), t = targets();
    if (!body) return $("#bc-body", ov).focus();
    if (!t.length) return;
    const btn = $("#bc-send", ov); btn.disabled = true; btn.textContent = "Sending…";
    try {
      const kind = $("#bc-kind", ov).value;
      const out = t.map(r => ({ member_id: r.p.id, kind, body: body.replace(/\{name\}/gi, r.p.display_name || (r.p.telegram_handle ? "@" + r.p.telegram_handle.replace(/^@/, "") : "there")) }));
      for (let i = 0; i < out.length; i += 100) {
        const saved = await api.addMessages(out.slice(i, i + 100));
        for (const s of saved) S.admin.meta.push({ member_id: s.member_id, author_id: s.author_id, created_at: s.created_at, kind: s.kind });
      }
      close(); toast(`Sent to ${t.length} member${t.length === 1 ? "" : "s"}`); render();
    } catch (e) { $("#bc-err", ov).textContent = e.message || String(e); btn.disabled = false; paintCount(); }
  };
  paintCount();
  $("#bc-body", ov).focus();
}

/* ===================== ADMIN DATA ===================== */
async function loadAdmin(force = false) {
  if (!force && Date.now() - S.admin.loadedAt < 30000) return;
  const [profiles, txs, meta] = await Promise.all([api.allProfiles(), api.allTransactions(), api.allMessageMeta()]);
  S.admin = { profiles, txs, meta, loadedAt: Date.now() };
  await CG.ensure(txs.map(t => t.coin_id));
}
function memberRows(includeAdmins = false) {
  const txBy = {}, metaBy = {};
  for (const t of S.admin.txs) (txBy[t.user_id] ||= []).push(t);
  for (const m of S.admin.meta) (metaBy[m.member_id] ||= []).push(m);
  return S.admin.profiles.filter(p => includeAdmins || p.role !== "admin").map(p => {
    const txs = txBy[p.id] || [];
    const pf = computePortfolio(txs);
    const msgs = metaBy[p.id] || [];
    const lastReviewerMsg = msgs.filter(m => m.author_id !== p.id).map(m => m.created_at).sort().pop();
    const newFromMember = msgs.filter(m => m.author_id === p.id && (!lastReviewerMsg || m.created_at > lastReviewerMsg)).length;
    const top = pf.holdings[0];
    return { p, pf, txs, top, newFromMember, lastActivity: [txs.at(-1)?.executed_at, msgs.at(-1)?.created_at, p.updated_at].filter(Boolean).sort().pop(), concentrated: top && top.alloc >= 50 && pf.holdings.length > 0 };
  });
}

/* Owner's private notes on a member (member_notes table, admin-only RLS). */
async function bindMemberNotes(p, names) {
  const list = $("#notes-list"); if (!list) return;
  let notes = [];
  const paint = () => {
    list.innerHTML = notes.length ? notes.map(n => `<div class="note-item" style="border-top:1px solid var(--border);padding:10px 0">
      <div style="white-space:pre-wrap">${esc(n.body)}</div>
      <div class="muted" style="font-size:12px;margin-top:4px;display:flex;gap:10px;align-items:center">${esc(names[n.author_id] || CONFIG.REVIEWER_NAME)} · ${ago(n.created_at)}
        <button class="btn" data-del-note="${esc(n.id)}" style="flex:none;margin-left:auto;padding:2px 10px;font-size:12px">Delete</button></div></div>`).join("")
      : `<div class="muted" style="font-size:13px">No notes yet. Anything you jot here stays for future reference.</div>`;
    list.querySelectorAll("[data-del-note]").forEach(b => b.onclick = () => confirmModal("Delete note?", "This note will be removed for good.", async () => {
      try { await api.deleteNote(b.dataset.delNote); notes = notes.filter(n => n.id !== b.dataset.delNote); paint(); } catch (e) { toast("Couldn't delete: " + (e.message || e)); }
    }));
  };
  try { notes = await api.notes(p.id); paint(); }
  catch (e) {
    list.innerHTML = `<div class="callout" style="font-size:13px">Notes aren't set up yet. Run <b>supabase/member_notes.sql</b> once in Supabase → SQL Editor, then reload.</div>`;
    $("#note-add").disabled = true; return;
  }
  $("#note-add").onclick = async () => {
    const ta = $("#note-body"), body = ta.value.trim();
    if (!body) return ta.focus();
    const btn = $("#note-add"); btn.disabled = true;
    try { const n = await api.addNote({ member_id: p.id, body }); notes.unshift(n); ta.value = ""; paint(); toast("Note saved"); }
    catch (e) { toast("Couldn't save: " + (e.message || e)); }
    btn.disabled = false;
  };
}

let recovering = false, authListening = false;
async function boot() {
  try {
    if (!DEMO && typeof window.supabase === "undefined") throw new Error("Couldn't load Supabase library. Check your connection.");
    if (!DEMO && !authListening && (authListening = true)) api.onAuthChange((ev) => { if (ev === "PASSWORD_RECOVERY") { recovering = true; renderAuth("recover"); } });
    const s = await api.session();
    if (recovering) return;
    if (!s) return renderAuth();
    await loadMe();
    await tgLink();
    // Members always open on their portfolio, whatever page they were on last time.
    if (!isAdmin() && location.hash !== "#overview") history.replaceState(null, "", location.pathname + location.search + "#overview");
    render();

  } catch (e) {
    $("#app").innerHTML = `<div class="auth-wrap"><div class="card" style="max-width:440px"><h2>Couldn't load</h2><p class="secondary">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">Retry</button></div></div>`;
  }
}

/* ===================== MOBILE KEYBOARD ===================== */
// "Done"/Enter closes the keyboard (and commits the value) on every input; tapping outside does too.
const isTypingEl = (el) => el && ((el.tagName === "INPUT" && !["checkbox", "radio", "range", "button", "submit", "file", "color"].includes(el.type)) || el.tagName === "TEXTAREA" || el.isContentEditable);
document.addEventListener("keydown", (e) => {
  const el = e.target;
  if (e.key !== "Enter" || e.isComposing || !el || el.tagName !== "INPUT" || !isTypingEl(el)) return;
  if (el.type !== "password") e.preventDefault();
  setTimeout(() => { if (document.activeElement === el) el.blur(); }, 0);
});
document.addEventListener("focusin", (e) => { const el = e.target; if (el && el.tagName === "INPUT" && isTypingEl(el) && !el.hasAttribute("enterkeyhint")) el.setAttribute("enterkeyhint", "done"); });
document.addEventListener("pointerdown", (e) => {
  const a = document.activeElement;
  if (!isTypingEl(a) || e.pointerType === "mouse") return;
  const t = e.target;
  if (t === a || (t.closest && t.closest("input, textarea, select, label, button, a, [contenteditable], [tabindex], .dropdown, .chip"))) return;
  a.blur();
}, true);
try { const go = new URLSearchParams(location.search).get("go"); if (go && /^[\w-]+$/.test(go)) history.replaceState(null, "", location.pathname + "#" + go); } catch (e) {}
boot();
</script>
