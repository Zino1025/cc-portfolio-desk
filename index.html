<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CC Portfolio Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ================= THEME ================= */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f3f2ee;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --border: rgba(11,11,11,0.10); --grid: #e1e0d9;
  --accent: #2a78d6; --accent-ink: #ffffff;
  --good: #006300; --bad: #d03b3b; --warn-bg: #fff4d6; --warn-ink: #7a5300;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --other: #b9b8b0;
  --radius: 12px;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232321;
    --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#898781;
    --border: rgba(255,255,255,0.10); --grid:#2c2c2a;
    --accent:#3987e5; --good:#0ca30c; --bad:#e66767; --warn-bg:#3a2e10; --warn-ink:#fab219;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#55554f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232321;
  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#898781;
  --border: rgba(255,255,255,0.10); --grid:#2c2c2a;
  --accent:#3987e5; --good:#0ca30c; --bad:#e66767; --warn-bg:#3a2e10; --warn-ink:#fab219;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --other:#55554f;
}

* { box-sizing: border-box; }
body { margin:0; background:var(--page); color:var(--text-primary); font-size:15px; line-height:1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.secondary { color: var(--text-secondary); }
.good { color: var(--good); } .bad { color: var(--bad); }
.hidden { display:none !important; }

/* ================= LAYOUT ================= */
header.top { position: sticky; top:0; z-index:20; background:var(--surface-1); border-bottom:1px solid var(--border); }
.top-inner { max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; }
.brand { font-weight:700; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px; white-space:nowrap; }
.brand .logo { width:26px; height:26px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-size:12px; font-weight:800; }
nav.tabs { display:flex; gap:4px; overflow-x:auto; flex:1; scrollbar-width:none; }
nav.tabs::-webkit-scrollbar { display:none; }
nav.tabs a { text-decoration:none; color:var(--text-secondary); padding:7px 12px; border-radius:8px; white-space:nowrap; font-size:14px; position:relative; }
nav.tabs a:hover { background:var(--surface-2); }
nav.tabs a.active { color:var(--text-primary); background:var(--surface-2); font-weight:600; }
nav.tabs .sep { width:1px; background:var(--border); margin:6px 4px; }
.badge { display:inline-block; min-width:18px; padding:0 5px; height:18px; line-height:18px; border-radius:9px; background:var(--bad); color:#fff; font-size:11px; font-weight:700; text-align:center; margin-left:4px; }
.user-chip { display:flex; align-items:center; gap:8px; font-size:13px; white-space:nowrap; }
main { max-width:1180px; margin:0 auto; padding:20px 16px 80px; }
.banner { background:var(--warn-bg); color:var(--warn-ink); padding:9px 16px; font-size:13px; text-align:center; }
.banner button { margin-left:8px; }

h1 { font-size:22px; margin:0 0 4px; letter-spacing:-0.01em; }
h2 { font-size:16px; margin:0 0 12px; }
.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }

.card { background:var(--surface-1); border:1px solid var(--border); border-radius:var(--radius); padding:16px; }
.grid { display:grid; gap:14px; }
.kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin-bottom:14px; }
.kpi .label { font-size:12px; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.04em; }
.kpi .value { font-size:24px; font-weight:650; margin-top:4px; letter-spacing:-0.01em; }
.kpi .sub { font-size:13px; margin-top:2px; }
.two-col { display:grid; grid-template-columns: minmax(280px, 380px) 1fr; gap:14px; align-items:start; }
.two-col > * { min-width:0; }
@media (max-width: 860px) { .two-col { grid-template-columns: 1fr; } }

/* ================= CONTROLS ================= */
.btn { white-space:nowrap; border:1px solid var(--border); background:var(--surface-1); padding:8px 14px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:550; }
.btn:hover { background:var(--surface-2); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.btn.primary:hover { filter:brightness(1.08); }
.btn.small { padding:5px 10px; font-size:13px; }
.btn.danger { color:var(--bad); }
.btn:disabled { opacity:.55; cursor:default; }
.link-btn { background:none; border:none; color:var(--accent); cursor:pointer; padding:0; font-size:13px; }
label.field { display:block; font-size:13px; color:var(--text-secondary); margin-bottom:12px; }
label.field > span, .field-div span:first-child, .field-div label span { display:block; margin-bottom:5px; }
.field-div { font-size:13px; color:var(--text-secondary); margin-bottom:12px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=datetime-local], input[type=search], select, textarea {
  width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); outline:none;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }
textarea { resize:vertical; min-height:70px; }
.row { display:flex; gap:10px; }
.row > * { flex:1; }
.seg { display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; border:1px solid var(--border); }
.seg button { border:none; background:none; padding:6px 14px; border-radius:7px; cursor:pointer; font-weight:550; color:var(--text-secondary); }
.seg button.on { background:var(--surface-1); color:var(--text-primary); box-shadow:0 1px 2px rgba(0,0,0,.12); }
.seg button.on.buy { color:var(--good); } .seg button.on.sell { color:var(--bad); }
.chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip { border:1px solid var(--border); background:var(--surface-1); border-radius:999px; padding:5px 11px; font-size:13px; cursor:pointer; color:var(--text-secondary); }
.chip.on { background:var(--text-primary); color:var(--surface-1); border-color:transparent; }
.toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.toolbar input[type=search] { max-width:260px; }
.toolbar select { width:auto; }

/* ================= TABLES ================= */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:14px; }
th { text-align:left; font-weight:550; color:var(--text-secondary); font-size:12px; text-transform:uppercase; letter-spacing:.04em; padding:8px 10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
td { padding:10px; border-bottom:1px solid var(--grid); white-space:nowrap; }
td.r, th.r { text-align:right; }
tr.click { cursor:pointer; }
tr.click:hover td { background:var(--surface-2); }
.coin { display:flex; align-items:center; gap:9px; }
.coin img, .coin .ph { width:22px; height:22px; border-radius:50%; flex:none; }
.coin .ph { background:var(--surface-2); display:grid; place-items:center; font-size:10px; font-weight:700; color:var(--text-secondary); border:1px solid var(--border); }
.coin .sym { color:var(--text-muted); font-size:12px; text-transform:uppercase; }
.swatch { width:10px; height:10px; border-radius:3px; display:inline-block; flex:none; }
.tag { display:inline-block; font-size:11px; font-weight:650; padding:2px 7px; border-radius:6px; background:var(--surface-2); color:var(--text-secondary); border:1px solid var(--border); text-transform:uppercase; letter-spacing:.03em; }
.tag.req { background:var(--warn-bg); color:var(--warn-ink); border-color:transparent; }
.tag.buy { color:var(--good); } .tag.sell { color:var(--bad); }
.tag.flag { color:var(--bad); }
.empty { text-align:center; padding:36px 16px; color:var(--text-secondary); }
.empty .big { font-size:17px; color:var(--text-primary); font-weight:600; margin-bottom:6px; }

/* ================= CHART ================= */
.chart-box { position:relative; height:240px; max-width:280px; margin:0 auto; }
.chart-center { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; text-align:center; }
.chart-center .v { font-size:19px; font-weight:650; }
.chart-center .l { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; }
.legend { margin-top:14px; display:grid; gap:6px; }
.legend .li { display:flex; align-items:center; gap:8px; font-size:13px; }
.legend .li .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.legend .li .p { color:var(--text-secondary); }

/* ================= THREAD ================= */
.thread { display:flex; flex-direction:column; gap:10px; max-height:520px; overflow-y:auto; padding:4px 2px; }
.msg { max-width:85%; padding:10px 13px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); white-space:pre-wrap; word-wrap:break-word; }
.msg.mine { align-self:flex-end; }
.msg.reviewer { border-left:3px solid var(--accent); }
.msg .meta { font-size:12px; color:var(--text-muted); margin-bottom:4px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.msg .meta b { color:var(--text-primary); font-weight:650; }
.composer { margin-top:12px; display:grid; gap:8px; }
.callout { background:var(--warn-bg); color:var(--warn-ink); border-radius:10px; padding:12px 14px; font-size:14px; margin-bottom:14px; white-space:pre-wrap; }

/* ================= MODAL / AUTH ================= */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:50; display:grid; place-items:center; padding:16px; }
.modal { background:var(--surface-1); border-radius:16px; width:100%; max-width:480px; max-height:92vh; overflow-y:auto; padding:20px; border:1px solid var(--border); }
.modal h2 { font-size:18px; display:flex; justify-content:space-between; align-items:center; }
.x { border:none; background:none; font-size:22px; cursor:pointer; color:var(--text-muted); line-height:1; }
.search-wrap { position:relative; }
.dropdown { position:absolute; left:0; right:0; top:100%; margin-top:4px; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:5; max-height:260px; overflow-y:auto; }
.dropdown .opt { padding:9px 11px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.dropdown .opt:hover, .dropdown .opt.hl { background:var(--surface-2); }
.picked { display:flex; align-items:center; justify-content:space-between; padding:9px 11px; border:1px solid var(--accent); border-radius:9px; background:var(--surface-2); }
.showpw { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-secondary); margin:-4px 0 12px; cursor:pointer; user-select:none; }
.showpw input { width:16px; height:16px; margin:0; accent-color:var(--accent); cursor:pointer; }
.hint { font-size:12px; color:var(--text-muted); margin-top:4px; }
.err { color:var(--bad); font-size:13px; margin:8px 0; min-height:1em; }
.auth-wrap { min-height:100vh; display:grid; place-items:center; padding:20px; }
.auth { width:100%; max-width:400px; }
.auth .brand { justify-content:center; font-size:20px; margin-bottom:6px; }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text-primary); color:var(--surface-1); padding:10px 16px; border-radius:10px; font-size:14px; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.25); }
.spinner { width:22px; height:22px; border:3px solid var(--grid); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:40px auto; }
@keyframes spin { to { transform:rotate(360deg); } }

@media (max-width: 640px) {
  #pj-table thead { display:none; }
  #pj-table table, #pj-table tbody { display:block; }
  #pj-table tr { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; padding:12px 0; border-bottom:1px solid var(--grid); position:relative; }
  #pj-table td { display:block; border:none; padding:0; white-space:normal; text-align:left; }
  #pj-table td[data-l]::before { content:attr(data-l); display:block; font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }
  #pj-table td[data-l="Coin"] { grid-column:1 / -1; padding-right:28px; }
  #pj-table td input { width:100% !important; }
  #pj-table .pj-rm { position:absolute; top:12px; right:0; }
  .top-inner { flex-wrap:wrap; }
  nav.tabs { order:3; flex-basis:100%; }
  .kpi .value { font-size:20px; }
  .hide-sm { display:none; }
  td, th { padding:8px 7px; }
}
</style>
</head>
<body>

<script>
/* =====================================================================
   CONFIG: fill these in after creating your Supabase project.
   Leave SUPABASE_URL empty to run in DEMO mode (sample data, no logins).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: "https://euoozfbbihtxrmafupeg.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_RK-nD_oFF3KHWQM2leIsrw_OW2kASrj",   // publishable key (safe in browser; RLS protects data)
  COINGECKO_DEMO_KEY: "",    // optional free key from coingecko.com/en/api (raises rate limits)
  REVIEWER_NAME: "Dkay",
  GROUP_NAME: "CC",
};
const DEMO = !CONFIG.SUPABASE_URL;

/* ===================== UTILITIES ===================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = (v) => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const LOCALE_DOT = (() => { try { return new Intl.NumberFormat().formatToParts(1.5).find(p => p.type === "decimal")?.value !== ","; } catch (e) { return true; } })();
/** Parse a typed amount: accepts "0,67", "1 200.5", "$4,326.87". */
function dec(v) {
  let s = String(v ?? "").trim().replace(/[\s$]/g, "");
  if (s.includes(",") && s.includes(".")) s = s.replace(/,/g, "");          // 1,234.56
  else if (/^[1-9]\d{0,2}(,\d{3})+$/.test(s) && LOCALE_DOT) s = s.replace(/,/g, ""); // 1,234 (dot-decimal locales)
  else s = s.replace(",", ".");                                              // 0,67
  const n = Number(s); return Number.isFinite(n) ? n : NaN;
}
const decOr0 = (v) => { const n = dec(v); return Number.isNaN(n) ? 0 : n; };
function fmtUsd(v, opts = {}) {
  const n = num(v), a = Math.abs(n);
  if (opts.compact && a >= 100000) return (n < 0 ? "-" : "") + "$" + new Intl.NumberFormat("en-US", { notation: "compact", maximumFractionDigits: 2 }).format(a);
  return (n < 0 ? "-" : "") + "$" + a.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtPrice(v) {
  const n = num(v);
  if (n === 0) return "$0";
  if (n >= 1) return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (n >= 0.01) return "$" + n.toFixed(4);
  return "$" + n.toPrecision(4);
}
function fmtQty(v) {
  const n = num(v);
  if (n >= 1000) return n.toLocaleString("en-US", { maximumFractionDigits: 2 });
  if (n >= 1) return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
  return n.toLocaleString("en-US", { maximumSignificantDigits: 6 });
}
function fmtPct(v, sign = true) { const n = num(v); return (sign && n > 0 ? "+" : "") + n.toFixed(2) + "%"; }
function signCls(v) { return num(v) > 0 ? "good" : num(v) < 0 ? "bad" : ""; }
function fmtDate(d, withTime = true) {
  if (!d) return "—";
  const dt = new Date(d);
  return dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) + (withTime ? " · " + dt.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) : "");
}
function ago(d) {
  if (!d) return "never";
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  if (s < 86400 * 30) return Math.floor(s / 86400) + "d ago";
  return fmtDate(d, false);
}
function toLocalInput(d) { const dt = new Date(d); const p = (n) => String(n).padStart(2, "0"); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}T${p(dt.getHours())}:${p(dt.getMinutes())}`; }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function memberName(p) { return p?.display_name || (p?.telegram_handle ? "@" + p.telegram_handle.replace(/^@/, "") : "Member"); }
function handleLink(h) { if (!h) return ""; const clean = esc(h.replace(/^@/, "")); return `<a href="https://t.me/${clean}" target="_blank" rel="noopener">@${clean}</a>`; }
function coinLink(id) { return `https://www.coingecko.com/en/coins/${encodeURIComponent(id)}`; }
function coinCell(c) {
  const img = c.image ? `<img src="${esc(c.image)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:'${esc((c.symbol||'?').slice(0,3).toUpperCase())}'}))">` : `<span class="ph">${esc((c.symbol || "?").slice(0, 3).toUpperCase())}</span>`;
  return `<div class="coin">${img}<div><div>${esc(c.name || c.coin_id)}</div><div class="sym">${esc(c.symbol || "")}</div></div></div>`;
}

/* ===================== COINGECKO ===================== */
const CG = {
  base: "https://api.coingecko.com/api/v3",
  cache: {},          // id -> { price, change24, mcap, image, symbol, name, at }
  offline: false,
  headers() { return CONFIG.COINGECKO_DEMO_KEY ? { "x-cg-demo-api-key": CONFIG.COINGECKO_DEMO_KEY } : {}; },
  async get(path) {
    const r = await fetch(this.base + path, { headers: this.headers() });
    if (!r.ok) throw new Error("CoinGecko " + r.status);
    return r.json();
  },
  /** Make sure we have fresh market data for these coin ids (batched). */
  async ensure(ids, maxAgeMs = 60000) {
    const now = Date.now();
    const need = [...new Set(ids)].filter(id => id && (!this.cache[id] || now - this.cache[id].at > maxAgeMs));
    for (let i = 0; i < need.length; i += 200) {
      const batch = need.slice(i, i + 200);
      try {
        const rows = await this.get(`/coins/markets?vs_currency=usd&ids=${encodeURIComponent(batch.join(","))}&per_page=250&price_change_percentage=24h`);
        for (const r of rows) this.cache[r.id] = { price: r.current_price, change24: r.price_change_percentage_24h, mcap: r.market_cap, image: r.image, symbol: r.symbol, name: r.name, at: now };
        this.offline = false;
      } catch (e) {
        this.offline = true;
        const ps = document.getElementById("price-src"); if (ps) ps.textContent = " and sample prices (CoinGecko unreachable here)";
        for (const id of batch) if (SAMPLE_PRICES[id] && !this.cache[id]) this.cache[id] = { ...SAMPLE_PRICES[id], at: now, sample: true };
      }
    }
  },
  async search(q) {
    try {
      const d = await this.get(`/search?query=${encodeURIComponent(q)}`);
      this.offline = false;
      return (d.coins || []).slice(0, 12).map(c => ({ id: c.id, name: c.name, symbol: c.symbol, image: c.thumb, rank: c.market_cap_rank }));
    } catch (e) {
      this.offline = true;
      const ql = q.toLowerCase();
      return Object.entries(SAMPLE_PRICES).filter(([id, c]) => id.includes(ql) || c.name.toLowerCase().includes(ql) || c.symbol.includes(ql))
        .map(([id, c]) => ({ id, name: c.name, symbol: c.symbol, rank: c.rank }));
    }
  },
  /** Daily price (00:00 UTC) on a given date. */
  async historical(id, date) {
    const d = new Date(date);
    if (Date.now() - d.getTime() < 24 * 3600 * 1000) { await this.ensure([id], 0); return this.cache[id]?.price ?? null; }
    const p = (n) => String(n).padStart(2, "0");
    const res = await this.get(`/coins/${encodeURIComponent(id)}/history?date=${p(d.getUTCDate())}-${p(d.getUTCMonth()+1)}-${d.getUTCFullYear()}&localization=false`);
    return res?.market_data?.current_price?.usd ?? null;
  },
  info(id) { return this.cache[id]; },
};

/* ===================== PORTFOLIO MATH (average cost) ===================== */
function computePortfolio(txs) {
  const byCoin = {};
  const sorted = [...txs].sort((a, b) => new Date(a.executed_at) - new Date(b.executed_at));
  let realizedTotal = 0;
  for (const t of sorted) {
    const h = byCoin[t.coin_id] ||= { coin_id: t.coin_id, symbol: t.symbol, name: t.name, qty: 0, cost: 0, realized: 0, firstBuy: null, lastTx: null, lastPrice: 0, trades: 0 };
    const q = num(t.quantity), p = num(t.price_usd), fee = num(t.fee_usd);
    h.trades++; h.lastTx = t.executed_at; h.lastPrice = p;
    if (t.symbol) h.symbol = t.symbol; if (t.name) h.name = t.name;
    if (t.side === "buy") {
      h.qty += q; h.cost += q * p + fee;
      if (!h.firstBuy) h.firstBuy = t.executed_at;
    } else {
      const sellQ = Math.min(q, h.qty);
      const avg = h.qty > 0 ? h.cost / h.qty : 0;
      const r = sellQ * p - fee - sellQ * avg;
      h.realized += r; realizedTotal += r;
      h.cost -= sellQ * avg; h.qty -= sellQ;
      if (h.qty < 1e-12) { h.qty = 0; h.cost = 0; }
    }
  }
  let value = 0, cost = 0, chg = 0, estimated = false;
  const holdings = [];
  for (const h of Object.values(byCoin)) {
    if (h.qty <= 0) continue;
    const info = CG.info(h.coin_id);
    const price = info?.price ?? h.lastPrice;
    if (!info) estimated = true;
    const v = h.qty * price;
    const c24 = info?.change24 ?? 0;
    holdings.push({ ...h, image: info?.image, price, value: v, avg: h.cost / h.qty, pnl: v - h.cost, pnlPct: h.cost > 0 ? (v - h.cost) / h.cost * 100 : 0, change24: c24, priceEstimated: !info });
    value += v; cost += h.cost; chg += v - v / (1 + c24 / 100);
  }
  holdings.sort((a, b) => b.value - a.value);
  for (const h of holdings) h.alloc = value > 0 ? h.value / value * 100 : 0;
  return { holdings, totals: { value, cost, pnl: value - cost, pnlPct: cost > 0 ? (value - cost) / cost * 100 : 0, realized: realizedTotal, change24Usd: chg, change24Pct: value - chg > 0 ? chg / (value - chg) * 100 : 0 }, estimated, coinIds: Object.keys(byCoin) };
}

function makeSupabaseApi() {
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw error; return data; };
  async function fetchAll(build) {
    const size = 1000; let from = 0, out = [];
    for (;;) { const data = ok(await build().range(from, from + size - 1)); out = out.concat(data); if (data.length < size) break; from += size; }
    return out;
  }
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session; },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signUp(email, password, meta) { const d = ok(await sb.auth.signUp({ email, password, options: { data: meta } })); return !!d.session; },
    async resetPassword(email) { ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })); },
    async updatePassword(pw) { ok(await sb.auth.updateUser({ password: pw })); },
    async signOut() { await sb.auth.signOut(); },
    async me() { const s = await this.session(); return ok(await sb.from("profiles").select("*").eq("id", s.user.id).single()); },
    async email() { const s = await this.session(); return s?.user?.email; },
    async transactions(userId) { return fetchAll(() => sb.from("transactions").select("*").eq("user_id", userId).order("executed_at")); },
    async addTx(tx) { return ok(await sb.from("transactions").insert(tx).select().single()); },
    async updateTx(id, tx) { return ok(await sb.from("transactions").update(tx).eq("id", id).select().single()); },
    async deleteTx(id) { ok(await sb.from("transactions").delete().eq("id", id)); },
    async updateProfile(id, patch) { return ok(await sb.from("profiles").update(patch).eq("id", id).select().single()); },
    async messages(memberId) { return fetchAll(() => sb.from("messages").select("*").eq("member_id", memberId).order("created_at")); },
    async addMessage(m) { return ok(await sb.from("messages").insert(m).select().single()); },
    async deleteMessage(id) { ok(await sb.from("messages").delete().eq("id", id)); },
    async allProfiles() { return fetchAll(() => sb.from("profiles").select("*").order("created_at")); },
    async allTransactions() { return fetchAll(() => sb.from("transactions").select("id,user_id,coin_id,symbol,name,side,quantity,price_usd,fee_usd,executed_at").order("executed_at")); },
    async allMessageMeta() { return fetchAll(() => sb.from("messages").select("member_id,author_id,created_at,kind").order("created_at")); },
    onAuthChange(cb) { sb.auth.onAuthStateChange((ev, s) => cb(ev, s)); },
  };
}

function renderDonut(canvasId, holdings, totalLabel, totalValue) {
  const el = document.getElementById(canvasId);

  if (S.charts[canvasId]) { S.charts[canvasId].destroy(); delete S.charts[canvasId]; }
  const top = holdings.slice(0, 7);

  const slices = top.map((h, i) => ({ label: (h.symbol || h.name || h.coin_id).toUpperCase(), name: h.name, value: h.value, alloc: h.alloc, color: cssVar(SERIES[i]) }));
  if (rest.length) slices.push({ label: "Other", name: `${rest.length} more coins`, value: rest.reduce((s, h) => s + h.value, 0), alloc: rest.reduce((s, h) => s + h.alloc, 0), color: cssVar("--other") });
  S.charts[canvasId] = new Chart(el, {
    type: "doughnut",
    data: { labels: slices.map(s => s.label), datasets: [{ data: slices.map(s => s.value), backgroundColor: slices.map(s => s.color), borderColor: cssVar("--surface-1"), borderWidth: 2, hoverOffset: 6, borderRadius: 4 }] },
    options: {

        callbacks: { title: (it) => slices[it[0].dataIndex].name || slices[it[0].dataIndex].label, label: (it) => `${fmtUsd(slices[it.dataIndex].value)} · ${slices[it.dataIndex].alloc.toFixed(1)}%` } } },
    },
  });

  if (center) center.innerHTML = `<div><div class="v num">${fmtUsd(totalValue, { compact: true })}</div><div class="l">${esc(totalLabel)}</div></div>`;
  const legend = document.getElementById(canvasId + "-legend");

function exportCsv() {
  const head = ["executed_at","side","coin_id","symbol","name","quantity","price_usd","fee_usd","exchange","note"];

  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));

/* ---------- Trade modal ---------- */
function openTradeModal(existing) {
  const t = existing ? { ...existing } : { side: "buy", executed_at: new Date().toISOString(), fee_usd: 0 };
  let coin = existing ? { id: existing.coin_id, name: existing.name, symbol: existing.symbol, image: CG.info(existing.coin_id)?.image } : null;
  const ov = document.createElement("div");
  ov.className = "overlay";
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
    <h2>${existing ? "Edit trade" : "Add trade"} <button class="x" aria-label="Close">×</button></h2>
    <div style="margin-bottom:14px"><div class="seg" id="side"><button data-s="buy" class="buy">Buy</button><button data-s="sell" class="sell">Sell</button></div></div>
    <div class="field-div"><span>Coin (search CoinGecko)</span><div id="coin-slot"></div></div>
    <div class="row">
      <label class="field"><span>Quantity (coins)</span><input type="text" inputmode="decimal" autocomplete="off" id="qty" value="${existing ? esc(existing.quantity) : ""}" placeholder="0.00"></label>
      <label class="field"><span>Price per coin (USD)</span><input type="text" inputmode="decimal" autocomplete="off" id="price" value="${existing ? esc(existing.price_usd) : ""}" placeholder="0.00"></label>
    </div>
    <label class="field"><span>Total (USD) <span class="muted">· type this instead of price if easier</span></span><input type="text" inputmode="decimal" autocomplete="off" id="total" placeholder="0.00"></label>
    <div class="field-div"><label for="when"><span>Date &amp; time of trade</span></label><input type="datetime-local" id="when" value="${toLocalInput(t.executed_at)}">
      <div class="hint"><button class="link-btn" id="fill-price" type="button">Fill price from CoinGecko for this date</button> <span id="fill-status"></span></div></div>
    <div class="row">
      <label class="field"><span>Fee (USD)</span><input type="text" inputmode="decimal" autocomplete="off" id="fee" value="${esc(t.fee_usd ?? 0)}"></label>
      <label class="field"><span>Exchange / wallet</span><input type="text" id="exch" value="${esc(t.exchange || "")}" placeholder="MEXC, Binance, Phantom…" maxlength="60"></label>
    </div>
    <label class="field"><span>Note (why you bought, target, etc.)</span><textarea id="note" maxlength="500" placeholder="Optional">${esc(t.note || "")}</textarea></label>
    <div class="err" id="trade-err"></div>
    <div class="row" style="justify-content:flex-end"><button class="btn" id="cancel" style="flex:none">Cancel</button><button class="btn primary" id="save" style="flex:none">${existing ? "Save changes" : "Add trade"}</button></div>
  </div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.querySelector(".x").onclick = close; $("#cancel", ov).onclick = close;
  ov.addEventListener("click", e => { if (e.target === ov) close(); });
  let side = t.side;
  const paintSide = () => ov.querySelectorAll("#side button").forEach(b => b.classList.toggle("on", b.dataset.s === side));
  ov.querySelectorAll("#side button").forEach(b => b.onclick = () => { side = b.dataset.s; paintSide(); });
  paintSide();
  const qty = $("#qty", ov), price = $("#price", ov), total = $("#total", ov);
  let priceTouched = !!existing, lastMoney = "price";   // which of price/total the user typed last
  const syncTotal = () => { const q = decOr0(qty.value), p = decOr0(price.value); if (q && p) total.value = +(q * p).toFixed(2); };
  const syncPrice = () => { const q = decOr0(qty.value), tt = decOr0(total.value); if (q && tt) price.value = +(tt / q).toPrecision(8); };
  qty.oninput = () => { lastMoney === "total" ? syncPrice() : syncTotal(); };
  price.oninput = () => { priceTouched = true; lastMoney = "price"; syncTotal(); };
  total.oninput = () => { priceTouched = true; lastMoney = "total"; syncPrice(); };
  syncTotal();

  const slot = $("#coin-slot", ov);
  function paintCoin() {
    if (coin) {
      slot.innerHTML = `<div class="picked">${coinCell({ ...coin, coin_id: coin.id })}<button class="link-btn" type="button" id="change-coin">Change</button></div>`;
      $("#change-coin", ov).onclick = () => { coin = null; paintCoin(); };
      if (!existing && !price.value) prefillCurrent();
      return;
    }
    slot.innerHTML = `<div class="search-wrap"><input type="search" id="coin-q" placeholder="Type a name, ticker, or paste a CoinGecko link" autocomplete="off"><div class="dropdown hidden" id="coin-dd"></div></div>`;
    const q = $("#coin-q", ov), dd = $("#coin-dd", ov);
    q.focus();
    const run = debounce(async () => {
      let s = q.value.trim();
      const m = s.match(/coingecko\.com\/(?:[a-z]{2}\/)?coins\/([a-z0-9-]+)/i);
      if (m) s = m[1];
      if (s.length < 2) { dd.classList.add("hidden"); return; }
      dd.classList.remove("hidden"); dd.innerHTML = `<div class="opt muted">Searching…</div>`;
      const res = await CG.search(s);
      if (!res.length) { dd.innerHTML = `<div class="opt muted">No coins found. Try the ticker or paste the CoinGecko page link.</div>`; return; }
      dd.innerHTML = res.map((c, i) => `<div class="opt" data-i="${i}">${coinCell({ ...c, coin_id: c.id })}<span class="muted" style="font-size:12px">${c.rank ? "#" + c.rank : ""}</span></div>`).join("");
      dd.querySelectorAll(".opt[data-i]").forEach(o => o.onclick = () => { coin = res[+o.dataset.i]; paintCoin(); });
    }, 350);
    q.oninput = run;
  }
  async function prefillCurrent() {
    await CG.ensure([coin.id]);
    const p = CG.info(coin.id)?.price;
    if (p && !price.value && !priceTouched) { price.value = p; syncTotal(); }
  }
  paintCoin();

  $("#fill-price", ov).onclick = async () => {
    const st = $("#fill-status", ov);
    if (!coin) { st.textContent = "Pick a coin first."; return; }
    st.textContent = "Fetching…";
    try {
      const p = await CG.historical(coin.id, new Date($("#when", ov).value));
      if (p == null) { st.textContent = "No CoinGecko price for that date."; return; }
      price.value = +p.toPrecision(8); priceTouched = true; lastMoney = "price"; syncTotal();
      st.textContent = "Filled (CoinGecko daily price). Adjust to your exact fill if different.";
    } catch (e) { st.textContent = "Couldn't reach CoinGecko (free plan covers the past year). Enter the price manually."; }
  };

  $("#save", ov).onclick = async () => {
    const err = $("#trade-err", ov); err.textContent = "";
    if (!coin) return err.textContent = "Pick a coin.";
    const q = dec(qty.value), p = dec(price.value), feeV = $("#fee", ov).value.trim() === "" ? 0 : dec($("#fee", ov).value);
    if (!(q > 0)) return err.textContent = "Quantity must be a number above 0 (e.g. 1500 or 0.25).";
    if (Number.isNaN(p) || p < 0 || price.value.trim() === "") return err.textContent = "Enter the price per coin as a number (e.g. 0.67).";
    if (Number.isNaN(feeV) || feeV < 0) return err.textContent = "Fee must be a number (or 0).";
    const when = $("#when", ov).value;
    if (!when) return err.textContent = "Enter the date and time.";
    if (new Date(when) > new Date(Date.now() + 5 * 60000)) return err.textContent = "Trade time can't be in the future.";
    if (side === "sell") {
      const held = computePortfolio(S.txs.filter(x => x.id !== existing?.id)).holdings.find(h => h.coin_id === coin.id)?.qty || 0;
      if (q > held + 1e-9) return err.textContent = `You only hold ${fmtQty(held)} ${String(coin.symbol || "").toUpperCase()} before this trade.`;
    }
    const row = { coin_id: coin.id, symbol: coin.symbol, name: coin.name, side, quantity: q, price_usd: p, fee_usd: feeV, executed_at: new Date(when).toISOString(), exchange: $("#exch", ov).value.trim() || null, note: $("#note", ov).value.trim() || null };
    const btn = $("#save", ov); btn.disabled = true;
    try {
      if (existing) { const u = await api.updateTx(existing.id, row); S.txs = S.txs.map(x => x.id === existing.id ? u : x); toast("Trade updated"); }
      else { const n = await api.addTx(row); S.txs.push(n); toast("Trade added"); }
      close(); render();
    } catch (e) { btn.disabled = false; err.textContent = e.message || "Couldn't save."; }
  };
}

/* ===================== PROJECTIONS ===================== */
const PROJ_MULTS = [2, 3, 5, 10, 25, 50, 100];
function projFromPortfolio() {
  const pf = computePortfolio(S.txs);
  return pf.holdings.map(h => ({ id: uid(), coin_id: h.coin_id, symbol: h.symbol, name: h.name, image: h.image, own: true, qty: h.qty, cost: h.cost, invest: "", entry: "", target: "", mult: "" }));
}
function projRowCalc(r) {
  const now = CG.info(r.coin_id)?.price ?? 0;
  let qty = r.qty, cost = r.cost;
  if (!r.own) {
    const entry = r.entry !== "" && !Number.isNaN(dec(r.entry)) ? dec(r.entry) : now;
    const inv = decOr0(r.invest);
    qty = entry > 0 ? inv / entry : 0; cost = inv;
  }
  let target = r.target !== "" ? dec(r.target) : NaN;
  if (Number.isNaN(target) && r.mult !== "" && !Number.isNaN(dec(r.mult))) target = now * dec(r.mult);
  if (Number.isNaN(target)) target = now;
  const valueNow = qty * now, valueProj = qty * target;
  const mcap = CG.info(r.coin_id)?.mcap;
  return { now, qty, cost, target, valueNow, valueProj, gainVsNow: valueProj - valueNow, profit: valueProj - cost, roi: cost > 0 ? (valueProj - cost) / cost * 100 : 0, mult: now > 0 ? target / now : 0, mcapAtTarget: mcap && now > 0 ? mcap * target / now : null };
}

    <div class="card kpi"><div class="label">Return on cost</div><div class="value num ${signCls(profit)}">${T.cost > 0 ? fmtPct(profit / T.cost * 100) : "—"}</div><div class="sub muted">${T.cost > 0 ? (T.proj / T.cost).toFixed(2) + "× your money" : ""}</div></div>

  pieRows.forEach(h => h.alloc = T.proj > 0 ? h.value / T.proj * 100 : 0);
  if (S.charts["pie-proj"]) { S.charts["pie-proj"].destroy(); delete S.charts["pie-proj"]; }

  if (pieRows.length) renderDonut("pie-proj", pieRows, "Projected", T.proj);
  const tbl = $("#pj-table");
  if (!rows.length) { tbl.innerHTML = `<div class="empty">Tap <b>+ Add coin</b> to start${S.txs.length ? ", or <b>Load my portfolio</b>" : ""}.</div>`; return; }
  tbl.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Coin</th><th>Amount</th><th class="r">Price now</th><th>Target price</th><th>×</th><th class="r">Projected value</th><th class="r">Profit</th><th></th></tr></thead><tbody>
    ${rows.map((r, i) => { const c = calcs[i]; return `<tr data-row="${esc(r.id)}">

           <input type="text" inputmode="decimal" data-f="entry" value="${esc(r.entry)}" placeholder="buy at ${esc(fmtPrice(c.now))}" style="width:110px;margin-top:4px">`}</td>
      <td class="r num" data-l="Price now">${fmtPrice(c.now)}<div class="muted" style="font-size:12px">${fmtUsd(c.valueNow)}</div></td>
      <td data-l="Target price"><input type="text" inputmode="decimal" data-f="target" value="${esc(r.target !== "" ? r.target : (r.mult !== "" ? +c.target.toPrecision(6) : ""))}" placeholder="${esc(fmtPrice(c.now))}" style="width:115px">
        ${c.mcapAtTarget ? `<div class="muted" style="font-size:11px">MC at target ${fmtUsd(c.mcapAtTarget, { compact: true })}</div>` : ""}</td>
      <td data-l="Multiple ×"><input type="text" inputmode="decimal" data-f="mult" value="${esc(r.mult !== "" ? r.mult : (r.target !== "" && c.now > 0 ? +c.mult.toFixed(2) : ""))}" placeholder="1" style="width:64px"></td>

    <div class="hint">"Target price" and "×" are linked: type either one. MC = the market cap the coin would need at that price, a quick reality check.</div>`;

function paintProjKeepFocus() {

}

/* ===================== ADMIN DATA ===================== */
async function loadAdmin(force = false) {
  if (!force && Date.now() - S.admin.loadedAt < 30000) return;
  const [profiles, txs, meta] = await Promise.all([api.allProfiles(), api.allTransactions(), api.allMessageMeta()]);
  S.admin = { profiles, txs, meta, loadedAt: Date.now() };
  await CG.ensure(txs.map(t => t.coin_id));
}
function memberRows(includeAdmins = false) {
  const txBy = {}, metaBy = {};
  for (const t of S.admin.txs) (txBy[t.user_id] ||= []).push(t);
  for (const m of S.admin.meta) (metaBy[m.member_id] ||= []).push(m);
  return S.admin.profiles.filter(p => includeAdmins || p.role !== "admin").map(p => {
    const txs = txBy[p.id] || [];
    const pf = computePortfolio(txs);
    const msgs = metaBy[p.id] || [];
    const lastReviewerMsg = msgs.filter(m => m.author_id !== p.id).map(m => m.created_at).sort().pop();
    const newFromMember = msgs.filter(m => m.author_id === p.id && (!lastReviewerMsg || m.created_at > lastReviewerMsg)).length;
    const top = pf.holdings[0];
    return { p, pf, txs, top, newFromMember, lastActivity: [txs.at(-1)?.executed_at, msgs.at(-1)?.created_at, p.updated_at].filter(Boolean).sort().pop(), concentrated: top && top.alloc >= 50 && pf.holdings.length > 0 };
  });
}

    </div>
    <div class="card" style="margin-top:14px"><h2>Concentration risk (one coin ≥ 50% of portfolio)</h2>
      ${conc.length ? `<div class="table-wrap"><table><thead><tr><th>Member</th><th>Coin</th><th class="r">Weight</th><th class="r">Portfolio value</th><th class="hide-sm">Last reviewed</th></tr></thead><tbody>
      ${conc.map(r => `<tr class="click" data-id="${esc(r.p.id)}"><td>${esc(memberName(r.p))}</td><td>${esc((r.top.symbol || "").toUpperCase())}</td><td class="r num bad">${r.top.alloc.toFixed(1)}%</td><td class="r num">${fmtUsd(r.pf.totals.value)}</td><td class="hide-sm secondary">${ago(r.p.last_reviewed_at)}</td></tr>`).join("")}</tbody></table></div>` : `<div class="empty">No concentrated portfolios right now.</div>`}
    </div>`;
  if (list.length) renderDonut("pie-group", list, "Group total", total);
  v.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => { location.hash = "member-" + tr.dataset.id; });
}

/* ===================== AUTH ===================== */
function renderAuth(mode = "signin", msg = "") {
  $("#app").innerHTML = `<div class="auth-wrap"><div class="auth">
    <div class="brand"><span class="logo">${esc(CONFIG.GROUP_NAME)}</span>Portfolio Desk</div>
    <p class="secondary" style="text-align:center;margin:0 0 18px">Track your bags. Get ${esc(CONFIG.REVIEWER_NAME)}'s feedback without the DMs.</p>
    <div class="card">
      ${mode === "recover" ? `
        <h2>Set a new password</h2>
        <label class="field"><span>New password</span><input type="password" id="a-pw" minlength="8" autocomplete="new-password"></label>
        <label class="showpw"><input type="checkbox" data-showpw="a-pw"> Show password</label>
        <div class="err" id="a-err">${esc(msg)}</div>
        <button class="btn primary" id="a-go" style="width:100%">Save password</button>` : `
      <div class="seg" style="width:100%;margin-bottom:16px"><button style="flex:1" class="${mode === "signin" ? "on" : ""}" data-m="signin">Sign in</button><button style="flex:1" class="${mode === "signup" ? "on" : ""}" data-m="signup">Create account</button></div>
      ${mode === "signup" ? `
        <label class="field"><span>Display name</span><input type="text" id="a-name" maxlength="60" autocomplete="nickname"></label>
        <label class="field"><span>Telegram handle</span><input type="text" id="a-tg" maxlength="40" placeholder="@yourhandle"></label>` : ""}
      <label class="field"><span>Email</span><input type="email" id="a-email" autocomplete="email"></label>
      <label class="field"><span>Password</span><input type="password" id="a-pw" minlength="8" autocomplete="${mode === "signup" ? "new-password" : "current-password"}"></label>
      <label class="showpw"><input type="checkbox" data-showpw="a-pw"> Show password</label>
      <div class="err" id="a-err">${esc(msg)}</div>
      <button class="btn primary" id="a-go" style="width:100%">${mode === "signup" ? "Create account" : "Sign in"}</button>
      ${mode === "signin" ? `<div style="text-align:center;margin-top:12px"><button class="link-btn" id="a-forgot">Forgot password?</button></div>` : ""}`}
    </div>
    <p class="muted" style="text-align:center;font-size:12px;margin-top:14px">Your portfolio is private: only you and ${esc(CONFIG.REVIEWER_NAME)} can see it.</p>
  </div></div>`;
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  const err = (m) => $("#a-err").textContent = m;
  $("#a-go").onclick = async () => {
    const pw = $("#a-pw").value;
    try {
      if (mode === "recover") { if (pw.length < 8) return err("Password needs 8+ characters."); await api.updatePassword(pw); toast("Password updated"); return boot(); }
      const email = $("#a-email").value.trim();
      if (!email || !pw) return err("Enter email and password.");
      if (mode === "signup") {
        if (pw.length < 8) return err("Password needs 8+ characters.");
        const name = $("#a-name").value.trim(), tg = $("#a-tg").value.trim().replace(/^@/, "");
        if (!name) return err("Add a display name so " + CONFIG.REVIEWER_NAME + " knows who you are.");
        const hasSession = await api.signUp(email, pw, { display_name: name, telegram_handle: tg || null });
        if (!hasSession) return renderAuth("signin", "Account created. Check your email to confirm, then sign in.");
      } else {
        await api.signIn(email, pw);
      }
      boot();
    } catch (e) { err(e.message || "Something went wrong."); }
  };
  $("#a-forgot") && ($("#a-forgot").onclick = async () => {
    const email = $("#a-email").value.trim(); if (!email) return err("Type your email above first.");
    try { await api.resetPassword(email); err("If that email has an account, a reset link is on its way."); } catch (e) { err(e.message); }
  });
  $("#a-pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#a-go").click(); });
}

/* ===================== BOOT ===================== */
async function loadMe() {
  S.proj = null;
  S.me = await api.me();
  S.email = await api.email();
  S.txs = await api.transactions(S.me.id);
  S.msgs = await api.messages(S.me.id);
  S.admin.loadedAt = 0;
  if (isAdmin()) await loadAdmin(true);
}
let recovering = false, authListening = false;
async function boot() {
  try {
    if (!DEMO && typeof window.supabase === "undefined") throw new Error("Couldn't load Supabase library. Check your connection.");
    if (!DEMO && !authListening && (authListening = true)) api.onAuthChange((ev) => { if (ev === "PASSWORD_RECOVERY") { recovering = true; renderAuth("recover"); } });
    const s = await api.session();
    if (recovering) return;
    if (!s) return renderAuth();
    await loadMe();
    render();
  } catch (e) {
    $("#app").innerHTML = `<div class="auth-wrap"><div class="card" style="max-width:440px"><h2>Couldn't load</h2><p class="secondary">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">Retry</button></div></div>`;
  }
}
setInterval(() => { if (S.me && !document.hidden && ["overview"].includes(currentRoute())) { CG.ensure(S.txs.map(t => t.coin_id)).then(() => { if (currentRoute() === "overview" && !document.querySelector(".overlay")) render(); }); } }, 60000);
/* ===================== TELEGRAM MINI APP ===================== */
const TG = (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) ? window.Telegram.WebApp : null;
function tgTheme() { try { if (!localStorage.getItem("cc-theme")) document.documentElement.dataset.theme = TG.colorScheme === "dark" ? "dark" : "light"; } catch (e) {} }
if (TG) { try { TG.ready(); TG.expand(); tgTheme(); TG.onEvent("themeChanged", tgTheme); document.documentElement.classList.add("in-telegram"); } catch (e) {} }
boot();
</script>
